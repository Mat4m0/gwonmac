# The local toolchain, pinned to what CI actually runs.
#
# Every version here is already declared somewhere the build reads; this file
# exists so a local shell resolves the same ones instead of whatever happens to
# sit earliest on PATH. That drift is not hypothetical: Homebrew's node and
# Homebrew's Rust both shadow the pinned versions on a default macOS setup, and
# the second one fails `pnpm build` with `can't find crate for core` because it
# carries no wasm32 standard library.
#
#   node   -> .github/workflows/*.yml pin node-version "24" (package.json
#             engines allows >=22.6; 24 is what every gate is verified against)
#   pnpm   -> package.json packageManager, which pnpm/action-setup reads in CI
#   rust   -> rust-toolchain.toml, including the wasm32 target the companion
#             kernel compiles to
#
# CI does not use mise -- it pins the same versions through setup-node,
# pnpm/action-setup, and rustup reading rust-toolchain.toml. Keep this file in
# step with those three when any of them moves.
[tools]
node = "24"
pnpm = "11.13.1"
rust = { version = "1.88.0", targets = "wasm32-unknown-unknown" }
