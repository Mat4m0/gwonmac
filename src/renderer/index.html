<!doctype html>
<meta charset="utf-8">
<title>Guild Wars Reforged</title>
<link rel="icon" href="favicon.png" type="image/png" sizes="48x48">
<link rel="stylesheet" href="fonts/inter.css">
<link rel="stylesheet" href="ui/tokens.css">
<link rel="stylesheet" href="ui/components.css">
<link rel="stylesheet" href="harness.css">
<link rel="stylesheet" href="cartography-overlay-controls.css">
<link rel="stylesheet" href="character-switch.css">
<link rel="stylesheet" href="loading.css">
<canvas id="canvas" width="1280" height="800" tabindex="0" autofocus></canvas>
<!-- Main prepares the client before creating this window. This renderer owns
     only a bounded diagnostic fallback while the first game frame is pending. -->
<div id="loading" role="status" aria-live="polite">
  <img src="images/logo.webp" alt="Guild Wars Reforged">
  <p id="loading-label">Starting Guild Wars…</p>
  <p id="loading-detail"></p>
  <details id="loading-crash-detail" hidden>
    <summary>Technical details</summary>
    <pre id="loading-crash-text"></pre>
  </details>
</div>
<!-- The official game glue focuses these hidden inputs to receive text. -->
<div class="osk-input-container"><input type="text" id="osk-input-text" class="osk-input" tabindex="-1" enterkeyhint="enter" autocomplete="off" autocorrect="off" autocapitalize="off" spellcheck="false" writingsuggestions="false"></div>
<div class="osk-input-container"><input type="email" id="osk-input-email" class="osk-input" tabindex="-1" enterkeyhint="enter" autocomplete="off" autocorrect="off" autocapitalize="off" spellcheck="false" writingsuggestions="false"></div>
<div class="osk-input-container"><input type="password" id="osk-input-password" class="osk-input" tabindex="-1" autocomplete="off" autocorrect="off" autocapitalize="off" spellcheck="false" writingsuggestions="false"></div>
<div class="osk-input-container"><input type="number" id="osk-input-number" class="osk-input" tabindex="-1" enterkeyhint="enter" autocomplete="off" autocorrect="off" autocapitalize="off" spellcheck="false" writingsuggestions="false"></div>
<div class="osk-input-container"><textarea id="osk-input-multiline" class="osk-input" rows="3" tabindex="-1" autocomplete="off" autocorrect="off" autocapitalize="off" spellcheck="false" writingsuggestions="false"></textarea></div>
<div id="log"></div>
<output id="diagnostics" aria-live="off"></output>
<div id="memory-notice" hidden>
  <div class="memory-notice-copy">
    <div id="memory-notice-text" role="status" aria-live="polite" aria-atomic="true"><strong id="memory-notice-label"></strong><span id="memory-notice-detail"></span></div>
    <details id="memory-notice-details"><summary>Details</summary><p id="memory-notice-explanation"></p></details>
    <label class="memory-notice-relog ui-check"><input type="checkbox" id="memory-notice-auto-relog"><span>Return to my character automatically</span></label>
  </div>
  <div id="memory-notice-actions"><button type="button" id="memory-notice-later" class="ui-button" data-variant="quiet"></button><button type="button" id="memory-notice-reload" class="ui-button" data-variant="primary"></button></div>
</div>
<output id="capture-status" hidden aria-live="off"><span class="capture-dot" aria-hidden="true"></span><span id="capture-label">Performance capture · 00:00</span><span id="capture-marker" hidden>Problem marked ✓</span></output>
<output id="diagnostic-profile-banner" hidden>Diagnostic profile active: <strong id="diagnostic-profile-name"></strong></output>
<output id="login-status" role="status" aria-live="polite" hidden></output>
<span id="capture-announcement" class="sr-only" role="status" aria-live="polite"></span>
<!-- These remain classic scripts because Emscripten shares a global var Module. -->
<script src="diagnostics.js"></script>
<script src="commands.js"></script>
<script src="loading.js"></script>
<script src="harness.js"></script>
