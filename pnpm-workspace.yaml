packages:
  - "apps/*"
# Default isolated linker keeps .bin links. publicHoistPattern satisfies Electron Forge.
publicHoistPattern:
  - "*"
confirmModulesPurge: false
blockExoticSubdeps: false
overrides:
  "brace-expansion@": 5.0.9
  fast-uri: 3.1.5
  ip-address: 10.3.1
  nanoid: 3.3.18
  tar: 7.5.21
  tmp: 0.2.7
  "undici@7": 7.29.0
  "undici@8": 8.9.0
  # Fresh re-resolution rebinds part of the Nuxt graph to the unhead 2.x
  # family, which mismatches the 3.x API and breaks the website build/server.
  unhead: 3.2.3
  "@unhead/vue": 3.2.3
allowBuilds:
  electron: true
  esbuild: true
  fs-xattr: true
  macos-alias: true
  vue-demi: true
# Electron Forge's packaging-only legacy minimatch graph requires
# brace-expansion 1/2; forcing the incompatible major 5 is not a fix.
# Its DMG maker likewise reaches image-size 0.7 through appdmg's callback API.
# The affected ICNS/JXL/HEIF parsers never receive input: appdmg measures the
# repository-owned PNG background and copies the ICNS icon without parsing it.
auditConfig:
  ignoreGhsas:
    # Electron Forge reaches extract-zip only through its packaging toolchain.
    # No patched extract-zip release exists yet; Electron archives come from
    # the checksum-verified @electron/get path, not from player-controlled data.
    - GHSA-jmr9-qjv8-65gv
    - GHSA-w3rx-r6r6-pgpr
    - GHSA-5p2g-fcmc-qvqq
    # Electron Forge 7 reaches extract-zip only through Electron Packager's
    # extraction of the trusted Electron distribution during packaging. The
    # application never passes user-controlled archives to this dependency,
    # and no patched extract-zip release currently exists.
    - GHSA-jmr9-qjv8-65gv
    # The affected esbuild serve-directory path exists only on Windows. Owned
    # automation runs on macOS/Linux, and fontless invokes only transform.
    - GHSA-g7r4-m6w7-qqqr
