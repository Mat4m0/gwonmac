packages:
  - "apps/*"
# Default isolated linker keeps .bin links. publicHoistPattern satisfies Electron Forge.
publicHoistPattern:
  - "*"
confirmModulesPurge: false
blockExoticSubdeps: false
overrides:
  "brace-expansion@": 5.0.9
  fast-uri: 3.1.5
  ip-address: 10.3.1
  tar: 7.5.21
  tmp: 0.2.7
  "undici@7": 7.29.0
  "undici@8": 8.9.0
allowBuilds:
  electron: true
  esbuild: true
  fs-xattr: true
  macos-alias: true
  vue-demi: true
# Electron Forge's packaging-only legacy minimatch graph requires
# brace-expansion 1/2; forcing the incompatible major 5 is not a fix.
auditConfig:
  ignoreGhsas:
    - GHSA-mh99-v99m-4gvg
