packages:
  - "apps/*"
# Nuxt I18n resolves these declared dependencies from Nuxt Kit rather than from
# its own package. Keep that compatibility surface exact; Forge also accepts
# this narrow pattern as proof that pnpm packaging was configured intentionally.
publicHoistPattern:
  - "@intlify/core"
  - "@intlify/core-base"
  - "@intlify/message-compiler"
  - "@intlify/shared"
  - "@intlify/utils"
  - "vue-i18n"
confirmModulesPurge: false
blockExoticSubdeps: false
overrides:
  "brace-expansion@": 5.0.9
  fast-uri: 3.1.5
  ip-address: 10.3.1
  nanoid: 3.3.18
  tar: 7.5.21
  tmp: 0.2.7
  "undici@7": 7.29.0
  "undici@8": 8.9.0
  # Forge's Packager 18 still names the retired extractor. Electron's hardened
  # drop-in keeps that API while rejecting symlink escapes.
  extract-zip: "npm:@electron-internal/extract-zip@1.0.4"
  # Fresh re-resolution rebinds part of the Nuxt graph to the unhead 2.x
  # family, which mismatches the 3.x API and breaks the website build/server.
  unhead: 3.2.3
  "@unhead/vue": 3.2.3
packageExtensions:
  "@nuxt/scripts@0.13.4":
    dependencies:
      estree-walker: 3.0.3
  "nuxt-define@1.0.0":
    dependencies:
      "@nuxt/kit": 4.5.1
allowBuilds:
  electron: true
  esbuild: true
  fs-xattr: true
  macos-alias: true
  vue-demi: true
# Electron Forge's packaging-only legacy minimatch graph requires
# brace-expansion 1/2; forcing the incompatible major 5 is not a fix.
# Its DMG maker likewise reaches image-size 0.7 through appdmg's callback API.
# The affected ICNS/JXL/HEIF parsers never receive input: appdmg measures the
# repository-owned PNG background and copies the ICNS icon without parsing it.
auditConfig:
  ignoreGhsas:
    - GHSA-w3rx-r6r6-pgpr
    - GHSA-5p2g-fcmc-qvqq
    # The affected esbuild serve-directory path exists only on Windows. Owned
    # automation runs on macOS/Linux, and fontless invokes only transform.
    - GHSA-g7r4-m6w7-qqqr
