name: PR package

on:
  pull_request:

permissions:
  contents: read

concurrency:
  group: pr-package-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  verify:
    uses: ./.github/workflows/macos-verify.yml
    with:
      artifact-name: ${{ format('gwonmac-pr-{0}-{1}-{2}', github.event.pull_request.number, github.sha, github.run_attempt) }}
      artifact-retention-days: 3
      dependency-review: true
