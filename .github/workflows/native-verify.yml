name: Reusable native verification

on:
  workflow_call:
    inputs:
      artifact-name:
        description: Empty disables tested preview artifact handoff.
        required: false
        type: string
        default: ""
      artifact-retention-days:
        required: false
        type: number
        default: 1
      dependency-review:
        required: false
        type: boolean
        default: false

permissions:
  contents: read

jobs:
  static:
    runs-on: ubuntu-24.04
    outputs:
      matrix: ${{ steps.targets.outputs.matrix }}
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false
      - name: Review dependency changes
        if: inputs.dependency-review
        uses: actions/dependency-review-action@2031cfc080254a8a887f58cffee85186f0e49e48 # v4.9.0
        with:
          fail-on-severity: high
      - uses: pnpm/action-setup@008330803749db0355799c700092d9a85fd074e9 # v6.0.9
        with:
          version: 11.13.1
      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: "24"
          cache: pnpm
      - id: install
        run: pnpm install --frozen-lockfile
      - run: pnpm audit --audit-level=high
      - name: Resolve canonical native target matrix
        id: targets
        run: |
          matrix="$(node --import ./scripts/ts-hook.mjs --experimental-strip-types scripts/release-matrix.ts)"
          echo "matrix=$matrix" >> "$GITHUB_OUTPUT"
      - run: pnpm typecheck
      - run: pnpm lint
      - run: pnpm check:links
      - run: pnpm test:policy

  native:
    needs: static
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.static.outputs.matrix) }}
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@008330803749db0355799c700092d9a85fd074e9 # v6.0.9
        with:
          version: 11.13.1
      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: "24"
          cache: pnpm
      - name: Install Linux packaging and display tools
        id: prerequisites
        if: matrix.platform == 'linux'
        run: |
          sudo apt-get update
          sudo apt-get install --yes fakeroot xvfb
          if sysctl -n kernel.apparmor_restrict_unprivileged_userns >/dev/null 2>&1; then
            sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0
          fi
          test "$(sysctl -n kernel.unprivileged_userns_clone)" = "1"
      - id: install
        run: pnpm install --frozen-lockfile
      - name: Assert native runner identity
        id: identity
        run: >-
          node --import ./scripts/ts-hook.mjs --experimental-strip-types
          scripts/assert-native-target.ts ${{ matrix.targetId }}
      - id: build
        run: pnpm build
      - id: unit
        run: pnpm test:unit
      - id: integration
        run: pnpm test:integration
      - name: Test Electron on Linux
        id: electron-stable-linux
        if: matrix.platform == 'linux'
        env:
          GW_EXPECT_LINUX_KEYRING: unavailable
        run: xvfb-run --auto-servernum pnpm test:electron:stable
      - name: Test Electron
        id: electron-stable-native
        if: matrix.platform != 'linux'
        run: pnpm test:electron:stable
      - name: Test isolated renderer fault on Linux
        id: electron-fault-linux
        if: matrix.platform == 'linux'
        run: xvfb-run --auto-servernum pnpm test:electron:fault
      - name: Test isolated renderer fault
        id: electron-fault-native
        if: matrix.platform != 'linux'
        run: pnpm test:electron:fault
      - id: release
        run: pnpm test:release
      - id: make
        run: pnpm make:prepared
      - name: Test unpacked package on Linux
        id: packaged-linux
        if: matrix.platform == 'linux'
        run: xvfb-run --auto-servernum pnpm test:packaged
      - name: Test unpacked package
        id: packaged-native
        if: matrix.platform != 'linux'
        run: pnpm test:packaged
      - name: Verify macOS code signature
        id: signature
        if: matrix.platform == 'darwin'
        run: |
          app="$(find out -name 'Guild Wars.app' -type d -print -quit)"
          test -n "$app"
          codesign --verify --deep --strict --verbose=2 "$app"
          signature="$(codesign -dv --verbose=4 "$app" 2>&1)"
          echo "$signature"
          echo "$signature" | grep -E "Signature=adhoc|TeamIdentifier=not set"
      - id: artifact
        run: pnpm test:artifact

      - name: Prepare tested preview artifact
        if: inputs.artifact-name != ''
        id: preview
        run: >-
          node --import ./scripts/ts-hook.mjs --experimental-strip-types
          scripts/prepare-preview-artifact.ts ${{ matrix.targetId }}

      - name: Generate preview SBOM
        id: sbom
        if: inputs.artifact-name != ''
        uses: anchore/sbom-action@e22c389904149dbc22b58101806040fa8d37a610 # v0
        with:
          path: ${{ steps.preview.outputs.application }}
          format: spdx-json
          output-file: ${{ steps.preview.outputs.sbom }}
          upload-artifact: false
          upload-release-assets: false

      - name: Finalize preview checksums
        id: checksums
        if: inputs.artifact-name != ''
        run: >-
          node --import ./scripts/ts-hook.mjs --experimental-strip-types
          scripts/finalize-preview-checksums.ts

      - name: Upload tested preview artifact
        id: preview-upload
        if: inputs.artifact-name != ''
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: ${{ inputs.artifact-name }}-${{ matrix.targetId }}-${{ github.run_attempt }}
          path: distribution/*
          if-no-files-found: error
          retention-days: ${{ inputs.artifact-retention-days }}
          compression-level: 0

      - name: Collect native failure evidence
        id: failure-manifest
        if: ${{ failure() && !cancelled() }}
        run: >-
          node --import ./scripts/ts-hook.mjs --experimental-strip-types
          scripts/native-ci-report.ts collect
          ${{ matrix.targetId }} ${{ github.sha }}
          ${{ github.run_id }} ${{ github.run_attempt }}
          prerequisites=${{ steps.prerequisites.outcome }}
          install=${{ steps.install.outcome }}
          identity=${{ steps.identity.outcome }}
          build=${{ steps.build.outcome }}
          unit=${{ steps.unit.outcome }}
          integration=${{ steps.integration.outcome }}
          electron-stable-linux=${{ steps.electron-stable-linux.outcome }}
          electron-stable-native=${{ steps.electron-stable-native.outcome }}
          electron-fault-linux=${{ steps.electron-fault-linux.outcome }}
          electron-fault-native=${{ steps.electron-fault-native.outcome }}
          release=${{ steps.release.outcome }}
          make=${{ steps.make.outcome }}
          packaged-linux=${{ steps.packaged-linux.outcome }}
          packaged-native=${{ steps.packaged-native.outcome }}
          signature=${{ steps.signature.outcome }}
          artifact=${{ steps.artifact.outcome }}
          preview=${{ steps.preview.outcome }}
          sbom=${{ steps.sbom.outcome }}
          checksums=${{ steps.checksums.outcome }}
          preview-upload=${{ steps.preview-upload.outcome }}

      - name: Upload native test failure evidence
        id: failure-upload
        if: ${{ failure() && !cancelled() }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: native-test-results-${{ matrix.targetId }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: test-results/**
          if-no-files-found: error
          retention-days: 7

      - name: Summarize native verification
        if: ${{ always() && !cancelled() }}
        run: >-
          node --import ./scripts/ts-hook.mjs --experimental-strip-types
          scripts/native-ci-report.ts summary
          ${{ matrix.targetId }} ${{ github.sha }}
          ${{ github.run_id }} ${{ github.run_attempt }}
          prerequisites=${{ steps.prerequisites.outcome }}
          install=${{ steps.install.outcome }}
          identity=${{ steps.identity.outcome }}
          build=${{ steps.build.outcome }}
          unit=${{ steps.unit.outcome }}
          integration=${{ steps.integration.outcome }}
          electron-stable-linux=${{ steps.electron-stable-linux.outcome }}
          electron-stable-native=${{ steps.electron-stable-native.outcome }}
          electron-fault-linux=${{ steps.electron-fault-linux.outcome }}
          electron-fault-native=${{ steps.electron-fault-native.outcome }}
          release=${{ steps.release.outcome }}
          make=${{ steps.make.outcome }}
          packaged-linux=${{ steps.packaged-linux.outcome }}
          packaged-native=${{ steps.packaged-native.outcome }}
          signature=${{ steps.signature.outcome }}
          artifact=${{ steps.artifact.outcome }}
          preview=${{ steps.preview.outcome }}
          sbom=${{ steps.sbom.outcome }}
          checksums=${{ steps.checksums.outcome }}
          preview-upload=${{ steps.preview-upload.outcome }}

  linux-keyring:
    needs: static
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@008330803749db0355799c700092d9a85fd074e9 # v6.0.9
        with:
          version: 11.13.1
      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: "24"
          cache: pnpm
      - name: Install supported Secret Service fixture
        id: prerequisites
        run: |
          sudo apt-get update
          sudo apt-get install --yes dbus-x11 gnome-keyring libglib2.0-bin xvfb
          if sysctl -n kernel.apparmor_restrict_unprivileged_userns >/dev/null 2>&1; then
            sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0
          fi
          test "$(sysctl -n kernel.unprivileged_userns_clone)" = "1"
      - id: install
        run: pnpm install --frozen-lockfile
      - id: build
        run: pnpm build
      - name: Qualify saved login with GNOME Secret Service
        id: keyring
        env:
          GW_EXPECT_LINUX_KEYRING: available
        run: |
          dbus-run-session -- bash -euo pipefail -c '
            keyring_runtime="$RUNNER_TEMP/gw-keyring-runtime"
            mkdir -p "$keyring_runtime"
            chmod 700 "$keyring_runtime"
            export XDG_RUNTIME_DIR="$keyring_runtime"
            # Chromium selects libsecret only for a desktop environment that
            # actually advertises Secret Service support. This qualifies the
            # GNOME path instead of forcing a password-store test override.
            export XDG_CURRENT_DESKTOP=GNOME
            export DESKTOP_SESSION=gnome
            eval "$(printf "\n" | gnome-keyring-daemon --unlock --components=secrets)"
            gdbus call --session \
              --dest org.freedesktop.secrets \
              --object-path /org/freedesktop/secrets \
              --method org.freedesktop.Secret.Service.ReadAlias default
            xvfb-run --auto-servernum pnpm exec playwright test \
              --config=tests/electron/playwright.config.ts \
              tests/electron/app.spec.ts \
              --grep "saved login follows"
          '
      - name: Collect keyring qualification failure evidence
        if: ${{ failure() && !cancelled() }}
        run: >-
          node --import ./scripts/ts-hook.mjs --experimental-strip-types
          scripts/native-ci-report.ts collect
          linux-x64-keyring ${{ github.sha }}
          ${{ github.run_id }} ${{ github.run_attempt }}
          prerequisites=${{ steps.prerequisites.outcome }}
          install=${{ steps.install.outcome }}
          build=${{ steps.build.outcome }}
          keyring=${{ steps.keyring.outcome }}
      - name: Upload keyring qualification failure evidence
        if: ${{ failure() && !cancelled() }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: linux-keyring-test-results-${{ github.run_id }}-${{ github.run_attempt }}
          path: test-results/**
          if-no-files-found: error
          retention-days: 7
      - name: Summarize keyring qualification
        if: ${{ always() && !cancelled() }}
        run: >-
          node --import ./scripts/ts-hook.mjs --experimental-strip-types
          scripts/native-ci-report.ts summary
          linux-x64-keyring ${{ github.sha }}
          ${{ github.run_id }} ${{ github.run_attempt }}
          prerequisites=${{ steps.prerequisites.outcome }}
          install=${{ steps.install.outcome }}
          build=${{ steps.build.outcome }}
          keyring=${{ steps.keyring.outcome }}
