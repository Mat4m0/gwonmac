name: Linux signed qualification

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  installed-desktop:
    strategy:
      fail-fast: false
      matrix:
        desktop: [gnome, kde]
    runs-on: ubuntu-24.04
    timeout-minutes: 75
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - uses: pnpm/action-setup@d15e628ca66d93ee5f352c71671a7bc6a97af5c9 # v6.0.8
        with:
          version: 11.13.1
      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: 24.18.0
          cache: pnpm
      - name: Install GNOME build and desktop dependencies
        if: matrix.desktop == 'gnome'
        run: |
          sudo apt-get update
          sudo apt-get install -y flatpak flatpak-builder g++ libglib2.0-dev gnupg xvfb dbus-x11 gnome-keyring xdg-desktop-portal xdg-desktop-portal-gnome
      - name: Install KDE build and desktop dependencies
        if: matrix.desktop == 'kde'
        run: |
          sudo apt-get update
          sudo apt-get install -y flatpak flatpak-builder g++ libglib2.0-dev gnupg xvfb dbus-x11 plasma-workspace xdg-desktop-portal xdg-desktop-portal-kde kwalletmanager
      - name: Install Flatpak runtimes
        run: |
          flatpak remote-add --user --if-not-exists flathub https://dl.flathub.org/repo/flathub.flatpakrepo
          flatpak install --user -y flathub org.freedesktop.Platform//25.08 org.freedesktop.Sdk//25.08 org.electronjs.Electron2.BaseApp//25.08
      - run: pnpm install --frozen-lockfile
      - run: pnpm run check
      - name: Import the repository signing key
        shell: bash
        env:
          PRIVATE_KEY: ${{ secrets.LINUX_FLATPAK_GPG_PRIVATE_KEY }}
        run: |
          test -n "$PRIVATE_KEY"
          export GNUPGHOME="$RUNNER_TEMP/flatpak-release-gpg"
          mkdir -m 700 "$GNUPGHOME"
          printf '%s' "$PRIVATE_KEY" > "$RUNNER_TEMP/flatpak-release-key.asc"
          gpg --batch --import "$RUNNER_TEMP/flatpak-release-key.asc"
      - name: Build and install the production-signed package
        shell: bash
        env:
          GW_PACKAGE_INTENT: release
          KEY_ID: ${{ secrets.LINUX_FLATPAK_GPG_KEY_ID }}
        run: |
          test -n "$KEY_ID"
          export GNUPGHOME="$RUNNER_TEMP/flatpak-release-gpg"
          pnpm package:built
          flatpak-builder --user --disable-rofiles-fuse --force-clean --repo=flatpak-repo --gpg-sign="$KEY_ID" --gpg-homedir="$GNUPGHOME" flatpak-build packaging/linux/io.github.mat4m0.gwonmac.yml
          flatpak build-update-repo --gpg-sign="$KEY_ID" --gpg-homedir="$GNUPGHOME" flatpak-repo
          gpg --batch --export "$KEY_ID" > "$RUNNER_TEMP/flatpak-release-public.gpg"
          flatpak remote-add --user --gpg-import="$RUNNER_TEMP/flatpak-release-public.gpg" gwonmac-qualified "file://$GITHUB_WORKSPACE/flatpak-repo"
          flatpak install --user -y gwonmac-qualified io.github.mat4m0.gwonmac
      - name: Qualify installed credentials and Xwayland
        shell: bash
        env:
          DESKTOP: ${{ matrix.desktop }}
          GW_LINUX_SECRET_QUALIFICATION: "1"
        run: |
          desktop="${DESKTOP^^}"
          xvfb-run -a env \
            XDG_CURRENT_DESKTOP="$desktop" \
            XDG_SESSION_DESKTOP="$desktop" \
            XDG_SESSION_TYPE=x11 \
            dbus-run-session -- bash -euc '
            if [ "$DESKTOP" = gnome ]; then
              eval "$(printf "\n" | gnome-keyring-daemon --unlock --components=secrets)"
            fi
            pnpm test:linux-installed
          '
