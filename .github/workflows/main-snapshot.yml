name: Main snapshot

on:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: main-snapshot
  cancel-in-progress: false

jobs:
  verify:
    uses: ./.github/workflows/macos-verify.yml
    with:
      artifact-name: snapshot-assets-${{ github.run_id }}-${{ github.run_attempt }}
      artifact-retention-days: 1
      package-intent: preview-handoff

  sign:
    needs: verify
    permissions:
      contents: read
    uses: ./.github/workflows/sign-preview.yml
    secrets: inherit
    with:
      unsigned-artifact-name: snapshot-assets-${{ github.run_id }}-${{ github.run_attempt }}
      signed-artifact-name: signed-snapshot-assets-${{ github.run_id }}-${{ github.run_attempt }}
      commit-sha: ${{ github.sha }}
      signer-sha: ${{ github.sha }}

  publish:
    needs: sign
    permissions:
      actions: read
      artifact-metadata: write
      attestations: write
      contents: write
      id-token: write
    uses: ./.github/workflows/publish-snapshot.yml
    with:
      artifact-name: signed-snapshot-assets-${{ github.run_id }}-${{ github.run_attempt }}
      commit-sha: ${{ github.sha }}
      run-number: ${{ github.run_number }}
      require-current-main: true
      signer-sha: ${{ github.sha }}
