# The one definition of "verified" that every shipping path calls, so nothing
# reaches a tester or a release having passed a weaker gate than a review does.
name: Reusable macOS verification

on:
  workflow_call:
    inputs:
      artifact-name:
        description: Empty disables packaging handoff.
        required: false
        type: string
        default: ""
      artifact-retention-days:
        required: false
        type: number
        default: 1
      packaged-smoke:
        description: Run the ad-hoc packaged app without uploading an artifact.
        required: false
        type: boolean
        default: false
      dependency-review:
        required: false
        type: boolean
        default: false
      checkout-ref:
        description: Exact commit to verify; empty uses the workflow commit.
        required: false
        type: string
        default: ""
      package-intent:
        description: Closed packaging intent; empty means local ad-hoc.
        required: false
        type: string
        default: ""

permissions:
  contents: read

jobs:
  verify:
    runs-on: macos-26
    timeout-minutes: 45
    env:
      GW_PACKAGE_INTENT: ${{ inputs.package-intent }}
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          ref: ${{ inputs.checkout-ref || github.sha }}
          persist-credentials: false
      - name: Review dependency changes
        if: inputs.dependency-review
        uses: actions/dependency-review-action@a1d282b36b6f3519aa1f3fc636f609c47dddb294 # v5.0.0
        with:
          fail-on-severity: high
          # A reusable workflow called by workflow_dispatch has no pull_request
          # event, so the action cannot infer the comparison on its own.
          base-ref: ${{ github.event.pull_request.base.sha || github.event.repository.default_branch }}
          head-ref: ${{ github.event.pull_request.head.sha || inputs.checkout-ref || github.sha }}
      - uses: pnpm/action-setup@d15e628ca66d93ee5f352c71671a7bc6a97af5c9 # v6.0.8
      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: "24"
          cache: pnpm
      - name: Require Apple Silicon runner
        run: test "$(uname -m)" = "arm64"
      # The runner image's default toolchain is not this repository's. Installs
      # the one rust-toolchain.toml names, with no version repeated here.
      - name: Install the pinned Rust toolchain
        run: rustup toolchain install
      - run: pnpm install --frozen-lockfile
      - run: pnpm exec playwright install chromium
      - run: pnpm audit --audit-level=high
      - run: pnpm verify:runtime
      - name: Package and test the verified build
        if: inputs.packaged-smoke || inputs.artifact-name != ''
        run: pnpm package:built && pnpm test:packaged

      - name: Upload Electron failure evidence
        if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: electron-failure-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            test-results
            apps/tools/test-results
          if-no-files-found: ignore
          retention-days: 7

      - name: Prepare tested package
        if: inputs.artifact-name != ''
        id: package
        run: |
          app_count="$(find out -mindepth 2 -maxdepth 2 -name '*.app' -type d | wc -l | tr -d ' ')"
          if [ "$app_count" != "1" ]; then
            echo "Expected exactly one packaged app, found $app_count." >&2
            exit 1
          fi
          app="$(find out -mindepth 2 -maxdepth 2 -name '*.app' -type d -print -quit)"
          codesign --verify --deep --strict --verbose=2 "$app"
          signature="$(codesign -dv --verbose=4 "$app" 2>&1)"
          echo "$signature"
          echo "$signature" | grep "Signature=adhoc"
          echo "$signature" | grep "TeamIdentifier=not set"

          archive_product="Guild-Wars-Reforged"
          if [ "$GW_PACKAGE_INTENT" = "developer-build" ]; then
            test "$(basename "$app")" = "Guild Wars Reforged Preview.app"
            test "$(/usr/libexec/PlistBuddy -c 'Print :CFBundleIdentifier' \
              "$app/Contents/Info.plist")" = "io.github.mat4m0.gwonmac.preview"
            test ! -e "$app/Contents/Resources/distribution-channel.json"
            test ! -e "$app/Contents/embedded.provisionprofile"
            app_root="$(cd "$app" && pwd -P)"
            unexpected="$(find "$app" ! -type f ! -type d ! -type l -print -quit)"
            test -z "$unexpected"
            while IFS= read -r -d '' link; do
              target="$(realpath "$link")"
              case "$target" in
                "$app_root"/*) ;;
                *) echo "External app symlink: $link -> $target" >&2; exit 1 ;;
              esac
            done < <(find "$app" -type l -print0)
            archive_product="Guild-Wars-Reforged-Preview"
          fi

          commit="$(git rev-parse HEAD)"
          short="${commit:0:7}"
          mkdir distribution
          archive="$PWD/distribution/$archive_product-$short-macOS-arm64.zip"
          sbom="$PWD/distribution/$archive_product-$short-macOS-arm64.spdx.json"
          ditto -c -k --sequesterRsrc --keepParent "$app" "$archive"
          printf '%s\n' "$commit" > distribution/SOURCE_COMMIT.txt
          echo "app=$app" >> "$GITHUB_OUTPUT"
          echo "archive=$archive" >> "$GITHUB_OUTPUT"
          echo "sbom=$sbom" >> "$GITHUB_OUTPUT"

      - name: Generate package SBOM
        if: inputs.artifact-name != ''
        uses: anchore/sbom-action@e22c389904149dbc22b58101806040fa8d37a610 # v0
        with:
          path: ${{ steps.package.outputs.app }}
          format: spdx-json
          output-file: ${{ steps.package.outputs.sbom }}
          upload-artifact: false
          upload-release-assets: false

      - name: Finalize package checksums
        if: inputs.artifact-name != ''
        run: |
          (
            cd distribution
            shasum -a 256 ./*.zip ./*.spdx.json SOURCE_COMMIT.txt > SHA256SUMS.txt
            shasum -a 256 -c SHA256SUMS.txt
          )

      - name: Upload tested package
        if: inputs.artifact-name != ''
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: ${{ inputs.artifact-name }}
          path: distribution/*
          if-no-files-found: error
          retention-days: ${{ inputs.artifact-retention-days }}
          compression-level: 0
