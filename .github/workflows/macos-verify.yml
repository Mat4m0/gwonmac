name: Reusable macOS verification

on:
  workflow_call:
    inputs:
      artifact-name:
        description: Empty disables packaging handoff.
        required: false
        type: string
        default: ""
      artifact-retention-days:
        required: false
        type: number
        default: 1
      dependency-review:
        required: false
        type: boolean
        default: false
      checkout-ref:
        description: Exact commit to verify; empty uses the workflow commit.
        required: false
        type: string
        default: ""
      package-intent:
        description: Closed packaging intent; empty means local ad-hoc.
        required: false
        type: string
        default: ""

permissions:
  contents: read

jobs:
  verify:
    runs-on: macos-15
    timeout-minutes: 45
    env:
      GW_PACKAGE_INTENT: ${{ inputs.package-intent }}
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          ref: ${{ inputs.checkout-ref || github.sha }}
          persist-credentials: false
      - name: Review dependency changes
        if: inputs.dependency-review
        uses: actions/dependency-review-action@a1d282b36b6f3519aa1f3fc636f609c47dddb294 # v5.0.0
        with:
          fail-on-severity: high
      - uses: pnpm/action-setup@d15e628ca66d93ee5f352c71671a7bc6a97af5c9 # v6.0.8
      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: "24"
          cache: pnpm
      - name: Require Apple Silicon runner
        run: test "$(uname -m)" = "arm64"
      - run: pnpm install --frozen-lockfile
      - run: pnpm audit --audit-level=high
      - run: pnpm verify

      - name: Upload Electron failure evidence
        if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: electron-failure-${{ github.run_id }}-${{ github.run_attempt }}
          path: test-results
          if-no-files-found: ignore
          retention-days: 7

      - name: Prepare tested package
        if: inputs.artifact-name != ''
        id: package
        run: |
          app_count="$(find out -mindepth 2 -maxdepth 2 -name '*.app' -type d | wc -l | tr -d ' ')"
          if [ "$app_count" != "1" ]; then
            echo "Expected exactly one packaged app, found $app_count." >&2
            exit 1
          fi
          app="$(find out -mindepth 2 -maxdepth 2 -name '*.app' -type d -print -quit)"
          codesign --verify --deep --strict --verbose=2 "$app"
          signature="$(codesign -dv --verbose=4 "$app" 2>&1)"
          echo "$signature"
          echo "$signature" | grep -E "Signature=adhoc|TeamIdentifier=not set"

          commit="$(git rev-parse HEAD)"
          short="${commit:0:7}"
          mkdir distribution
          archive="$PWD/distribution/Guild-Wars-Reforged-$short-macOS-arm64.zip"
          sbom="$PWD/distribution/Guild-Wars-Reforged-$short-macOS-arm64.spdx.json"
          ditto -c -k --sequesterRsrc --keepParent "$app" "$archive"
          printf '%s\n' "$commit" > distribution/SOURCE_COMMIT.txt
          echo "app=$app" >> "$GITHUB_OUTPUT"
          echo "archive=$archive" >> "$GITHUB_OUTPUT"
          echo "sbom=$sbom" >> "$GITHUB_OUTPUT"

      - name: Generate package SBOM
        if: inputs.artifact-name != ''
        uses: anchore/sbom-action@e22c389904149dbc22b58101806040fa8d37a610 # v0
        with:
          path: ${{ steps.package.outputs.app }}
          format: spdx-json
          output-file: ${{ steps.package.outputs.sbom }}
          upload-artifact: false
          upload-release-assets: false

      - name: Finalize package checksums
        if: inputs.artifact-name != ''
        run: |
          (
            cd distribution
            shasum -a 256 ./*.zip ./*.spdx.json SOURCE_COMMIT.txt > SHA256SUMS.txt
            shasum -a 256 -c SHA256SUMS.txt
          )

      - name: Upload tested package
        if: inputs.artifact-name != ''
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: ${{ inputs.artifact-name }}
          path: distribution/*
          if-no-files-found: error
          retention-days: ${{ inputs.artifact-retention-days }}
          compression-level: 0
