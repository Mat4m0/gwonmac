# The only path to a public versioned release: dispatched by hand, refused off
# main, and gated on the approval environment holding the Developer ID material.
name: Versioned release

on:
  workflow_dispatch:
    inputs:
      dry_run:
        # Proves the whole release path — the same build, signing,
        # notarization, stapling, and verification a release runs — without
        # creating a tag, a release, or an attestation. It gates the publish
        # job alone, so a passing dry run is evidence about the real path
        # rather than about a second one.
        description: Build and verify the release, then publish nothing.
        default: false
        type: boolean

permissions:
  contents: read

concurrency:
  group: versioned-release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  verify:
    uses: ./.github/workflows/macos-verify.yml
    with:
      artifact-name: ""

  release-build:
    if: github.ref == 'refs/heads/main'
    needs: verify
    runs-on: macos-15
    timeout-minutes: 60
    environment: release
    permissions:
      actions: read
      contents: read
    outputs:
      prerelease: ${{ steps.version.outputs.prerelease }}
      tag: ${{ steps.version.outputs.tag }}
      version: ${{ steps.version.outputs.version }}
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@d15e628ca66d93ee5f352c71671a7bc6a97af5c9 # v6.0.8
      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: "24"
          cache: pnpm

      - name: Require Apple Silicon runner
        run: test "$(uname -m)" = "arm64"

      # The runner image's default toolchain is not this repository's. Installs
      # the one rust-toolchain.toml names, with no version repeated here.
      - name: Install the pinned Rust toolchain
        run: rustup toolchain install

      - name: Require a client canary newer than 14 days
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          runs="repos/$GITHUB_REPOSITORY/actions/workflows/client-canary.yml/runs"
          started="$(gh api \
            "$runs?status=success&branch=$GITHUB_REF_NAME&per_page=1" \
            --jq '.workflow_runs[0].run_started_at // ""')"
          test -n "$started"
          age="$(node -e '
            const started = Date.parse(process.argv[1]);
            if (Number.isNaN(started)) process.exit(1);
            console.log(Math.floor((Date.now() - started) / 86400000));
          ' "$started")"
          if [ "$age" -gt 14 ]; then
            echo "The ArenaNet client canary is $age days old; run it again." >&2
            exit 1
          fi

      - name: Resolve release version
        id: version
        env:
          SIGNED_BETA_UPDATE_PROVEN: ${{ vars.SIGNED_BETA_UPDATE_PROVEN }}
        run: |
          version="$(node -p "require('./package.json').version")"
          node --import ./scripts/ts-hook.mjs --experimental-strip-types -e '
            const { macOSBundleVersions } = await import("./scripts/macos-version.js");
            macOSBundleVersions(process.argv[1]);
          ' "$version"
          prerelease=false
          if [[ "$version" == *-* ]]; then prerelease=true; fi
          if [ "$prerelease" = "false" ]; then
            test "$SIGNED_BETA_UPDATE_PROVEN" = "true"
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "tag=v$version" >> "$GITHUB_OUTPUT"
          echo "prerelease=$prerelease" >> "$GITHUB_OUTPUT"

      # The same refusal the release job enforces before publishing, moved
      # ahead of the build so a forgotten version bump fails in seconds, not
      # after signing and notarization. This job's read-only token cannot see
      # draft releases, so a resumable draft passes through here and is
      # verified by the release job's own check.
      - name: Refuse a version that already shipped
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.version.outputs.tag }}
        run: |
          if gh release view "$TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            if [ "$(gh release view "$TAG" --repo "$GITHUB_REPOSITORY" \
              --json isDraft --jq '.isDraft')" != "true" ]; then
              echo "Release $TAG is already published; bump the version in package.json." >&2
              exit 1
            fi
            echo "Draft release $TAG exists; this run will resume it."
          elif gh api "repos/$GITHUB_REPOSITORY/git/ref/tags/$TAG" >/dev/null 2>&1; then
            echo "Tag $TAG exists without a resumable draft release." >&2
            exit 1
          fi

      - run: pnpm install --frozen-lockfile

      - name: Import Developer ID and notarization credentials
        env:
          CERTIFICATE_B64: ${{ secrets.APPLE_DEVELOPER_ID_P12 }}
          CERTIFICATE_PASSWORD: ${{ secrets.APPLE_DEVELOPER_ID_PASSWORD }}
          PROFILE_B64: ${{ secrets.APPLE_DEVELOPER_ID_PROFILE }}
          NOTARY_KEY_B64: ${{ secrets.APPLE_API_KEY_P8 }}
          API_KEY_ID: ${{ secrets.APPLE_API_KEY_ID }}
          API_ISSUER_ID: ${{ secrets.APPLE_API_ISSUER_ID }}
          TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: |
          umask 077
          test -n "$CERTIFICATE_B64"
          test -n "$CERTIFICATE_PASSWORD"
          test -n "$PROFILE_B64"
          test -n "$NOTARY_KEY_B64"
          test -n "$API_KEY_ID"
          test -n "$API_ISSUER_ID"
          test -n "$TEAM_ID"
          test "$TEAM_ID" = "9NN976MFZ4"
          keychain="$RUNNER_TEMP/gwonmac-release-$(openssl rand -hex 16).keychain-db"
          certificate="$RUNNER_TEMP/developer-id.p12"
          profile="$RUNNER_TEMP/gwonmac.provisionprofile"
          profile_plist="$RUNNER_TEMP/gwonmac-profile.plist"
          api_key="$RUNNER_TEMP/AuthKey_${API_KEY_ID}.p8"
          {
            echo "APPLE_KEYCHAIN=$keychain"
            echo "APPLE_CERTIFICATE_PATH=$certificate"
            echo "APPLE_PROVISIONING_PROFILE=$profile"
            echo "APPLE_PROFILE_PLIST=$profile_plist"
            echo "APPLE_API_KEY_PATH=$api_key"
            echo "APPLE_API_KEY_ID=$API_KEY_ID"
            echo "APPLE_API_ISSUER_ID=$API_ISSUER_ID"
            echo "APPLE_TEAM_ID=$TEAM_ID"
            echo "APPLE_SIGNING_IDENTITY=7F9A56793C16683742AA7818FE65221A884FA108"
          } >> "$GITHUB_ENV"
          keychain_password="$(openssl rand -hex 32)"
          printf '%s' "$CERTIFICATE_B64" | base64 --decode > "$certificate"
          printf '%s' "$PROFILE_B64" | base64 --decode > "$profile"
          printf '%s' "$NOTARY_KEY_B64" | base64 --decode > "$api_key"
          chmod 600 "$certificate" "$profile" "$api_key"
          security cms -D -i "$profile" > "$profile_plist"
          test "$(plutil -extract TeamIdentifier.0 raw -o - "$profile_plist")" = \
            "9NN976MFZ4"
          test "$(plutil -extract ProvisionsAllDevices raw -o - "$profile_plist")" = \
            "true"
          test "$(/usr/libexec/PlistBuddy -c \
            'Print :Entitlements:com.apple.application-identifier' \
            "$profile_plist")" = "9NN976MFZ4.io.github.mat4m0.gwonmac"
          test "$(/usr/libexec/PlistBuddy -c \
            'Print :Entitlements:com.apple.developer.team-identifier' \
            "$profile_plist")" = "9NN976MFZ4"
          expiry="$(plutil -extract ExpirationDate raw -o - "$profile_plist")"
          node -e '
            const remaining = Date.parse(process.argv[1]) - Date.now();
            if (remaining <= 2 * 365 * 86400000) process.exit(1);
            if (remaining <= 5 * 365 * 86400000) {
              console.log("::warning::Developer ID profile expires within five years");
            }
          ' "$expiry"
          profile_certificate="$RUNNER_TEMP/profile-certificate.der"
          plutil -extract DeveloperCertificates.0 raw -o - "$profile_plist" |
            base64 --decode > "$profile_certificate"
          test "$(shasum "$profile_certificate" | awk '{print toupper($1)}')" = \
            "7F9A56793C16683742AA7818FE65221A884FA108"
          rm -f "$profile_certificate"
          if plutil -extract DeveloperCertificates.1 raw -o /dev/null \
            "$profile_plist" 2>/dev/null; then
            echo "Provisioning profile contains an unexpected certificate." >&2
            exit 1
          fi
          security create-keychain -p "$keychain_password" "$keychain"
          security set-keychain-settings -lut 21600 "$keychain"
          security unlock-keychain -p "$keychain_password" "$keychain"
          security import "$certificate" -k "$keychain" \
            -P "$CERTIFICATE_PASSWORD" -T /usr/bin/codesign -T /usr/bin/security
          security set-key-partition-list \
            -S apple-tool:,apple:,codesign: -s \
            -k "$keychain_password" "$keychain"
          security list-keychains -d user -s "$keychain"
          security default-keychain -d user -s "$keychain"
          security find-identity -v -p codesigning "$keychain" |
            grep '7F9A56793C16683742AA7818FE65221A884FA108.*Developer ID Application: Matthias Amon (9NN976MFZ4)'
          security find-certificate -c \
            'Developer ID Application: Matthias Amon (9NN976MFZ4)' \
            -Z "$keychain" | grep '7F9A56793C16683742AA7818FE65221A884FA108'
          rm -f "$certificate"

      - name: Build, sign, notarize, and staple application
        env:
          GW_PACKAGE_INTENT: release
        run: pnpm make

      - name: Smoke-test signed release candidate
        env:
          GW_PACKAGE_INTENT: release
        run: pnpm test:packaged

      - name: Prove signed Data Protection Keychain continuity
        run: |
          app="$(find out -name 'Guild Wars Reforged.app' -type d -print -quit)"
          test -n "$app"
          GW_SIGNED_APP_PATH="$app" GW_SIGNED_CHANNEL=release \
            pnpm test:signed-keychain

      - name: Notarize and staple DMG
        run: |
          dmg_count="$(find out/make -type f -name '*.dmg' | wc -l | tr -d ' ')"
          test "$dmg_count" = "1"
          dmg="$(find out/make -type f -name '*.dmg' -print -quit)"
          xcrun notarytool submit "$dmg" --wait \
            --key "$APPLE_API_KEY_PATH" \
            --key-id "$APPLE_API_KEY_ID" \
            --issuer "$APPLE_API_ISSUER_ID"
          xcrun stapler staple -v "$dmg"

      # Every assertion this makes lives in scripts/verify-signed-app.ts, so a
      # release that fails one can be reproduced against the same package on a
      # developer's machine instead of only by cutting another release.
      - name: Verify Apple distribution identity and tickets
        env:
          GW_SIGNED_CHANNEL: release
        run: |
          pnpm verify:signed-app \
            "$(find out -name 'Guild Wars Reforged.app' -type d -print -quit)" \
            "$(find out/make -type f -name '*.dmg' -print -quit)"

      - name: Prepare immutable release assets
        id: assets
        env:
          GW_SIGNED_CHANNEL: release
          VERSION: ${{ steps.version.outputs.version }}
          TAG: ${{ steps.version.outputs.tag }}
        run: |
          asset_dir="$RUNNER_TEMP/release-assets"
          mkdir -p "$asset_dir"
          app="$(find out -name 'Guild Wars Reforged.app' -type d -print -quit)"
          zip_source="$(find out/make -type f -name '*.zip' -print -quit)"
          dmg_source="$(find out/make -type f -name '*.dmg' -print -quit)"
          test -n "$app"
          test -n "$zip_source"
          test -n "$dmg_source"
          zip="$asset_dir/Guild-Wars-Reforged-$VERSION-macOS-arm64.zip"
          dmg="$asset_dir/Guild-Wars-Reforged-$VERSION-macOS-arm64.dmg"
          cp "$zip_source" "$zip"
          cp "$dmg_source" "$dmg"
          manifest="$asset_dir/RELEASES.json"
          published_at="$(git show -s --format=%cI "$GITHUB_SHA")"
          node --import ./scripts/ts-hook.mjs --experimental-strip-types \
            scripts/release-manifest.ts \
            "$VERSION" "$TAG" "$(basename "$zip")" "$published_at" "$manifest"
          unzip_dir="$RUNNER_TEMP/unzipped-release"
          ditto -x -k "$zip" "$unzip_dir"
          pnpm verify:signed-app "$unzip_dir/Guild Wars Reforged.app"
          sbom="$asset_dir/Guild-Wars-Reforged-$VERSION-macOS-arm64.spdx.json"
          checksum="$asset_dir/SHA256SUMS.txt"
          {
            echo "asset_dir=$asset_dir"
            echo "app=$app"
            echo "zip=$zip"
            echo "dmg=$dmg"
            echo "manifest=$manifest"
            echo "sbom=$sbom"
            echo "checksum=$checksum"
          } >> "$GITHUB_OUTPUT"

      - name: Generate SPDX SBOM
        uses: anchore/sbom-action@e22c389904149dbc22b58101806040fa8d37a610 # v0
        with:
          path: ${{ steps.assets.outputs.app }}
          format: spdx-json
          output-file: ${{ steps.assets.outputs.sbom }}
          upload-artifact: false
          upload-release-assets: false

      - name: Finalize checksums
        env:
          ASSET_DIR: ${{ steps.assets.outputs.asset_dir }}
        run: |
          (
            cd "$ASSET_DIR"
            shasum -a 256 *.zip *.dmg RELEASES.json *.spdx.json > SHA256SUMS.txt
            shasum -a 256 -c SHA256SUMS.txt
          )

      # A dry run publishes nothing, so this is the only account it leaves of
      # what it built and what the verification covered.
      - name: Summarize built and verified assets
        env:
          ASSET_DIR: ${{ steps.assets.outputs.asset_dir }}
          DRY_RUN: ${{ inputs.dry_run }}
          TAG: ${{ steps.version.outputs.tag }}
        run: |
          outcome="built, signed, notarized, stapled, and verified"
          if [ "$DRY_RUN" = "true" ]; then
            headline="Dry run of $TAG: $outcome. Nothing published."
          else
            headline="$TAG: $outcome."
          fi
          {
            echo "### Release assets"
            echo
            echo "$headline"
            echo
            echo '```'
            cat "$ASSET_DIR/SHA256SUMS.txt"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Retain debug symbols
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: release-dsyms-${{ github.run_id }}-${{ github.run_attempt }}
          path: out/**/*.dSYM
          if-no-files-found: warn
          retention-days: 30

      - name: Handoff verified release assets
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: release-assets-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ steps.assets.outputs.asset_dir }}
          if-no-files-found: error
          retention-days: 1
          compression-level: 0

      - name: Delete temporary signing material
        if: always()
        run: |
          if [ -n "${APPLE_KEYCHAIN:-}" ]; then
            security delete-keychain "$APPLE_KEYCHAIN" || true
          fi
          if [ -n "${APPLE_CERTIFICATE_PATH:-}" ]; then
            rm -f "$APPLE_CERTIFICATE_PATH"
          fi
          if [ -n "${APPLE_API_KEY_PATH:-}" ]; then
            rm -f "$APPLE_API_KEY_PATH"
          fi
          if [ -n "${APPLE_PROVISIONING_PROFILE:-}" ]; then
            rm -f "$APPLE_PROVISIONING_PROFILE"
          fi
          if [ -n "${APPLE_PROFILE_PLIST:-}" ]; then
            rm -f "$APPLE_PROFILE_PLIST"
          fi

  # Every step below tags, attests, uploads, or publishes, and this is the only
  # job holding the write permissions to do it. A dry run skips the job whole;
  # nothing above it is conditional.
  release:
    if: github.ref == 'refs/heads/main' && !inputs.dry_run
    needs: release-build
    runs-on: macos-15
    timeout-minutes: 15
    permissions:
      attestations: write
      artifact-metadata: write
      contents: write
      id-token: write
    steps:
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: release-assets-${{ github.run_id }}-${{ github.run_attempt }}
          path: release-assets

      - name: Verify handoff and resolve draft release
        id: release-state
        env:
          GH_TOKEN: ${{ github.token }}
          PRERELEASE: ${{ needs.release-build.outputs.prerelease }}
          TAG: ${{ needs.release-build.outputs.tag }}
        run: |
          (
            cd release-assets
            test "$(find . -maxdepth 1 -name '*.zip' | wc -l | tr -d ' ')" = "1"
            test "$(find . -maxdepth 1 -name '*.dmg' | wc -l | tr -d ' ')" = "1"
            test -f RELEASES.json
            test -f SHA256SUMS.txt
            shasum -a 256 -c SHA256SUMS.txt
          )
          sbom_count="$(find release-assets -maxdepth 1 -type f -name '*.spdx.json' |
            wc -l | tr -d ' ')"
          test "$sbom_count" = "1"
          sbom="$(find release-assets -maxdepth 1 -type f -name '*.spdx.json' -print -quit)"
          echo "sbom=$sbom" >> "$GITHUB_OUTPUT"
          if gh release view "$TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            if [ "$(gh release view "$TAG" --repo "$GITHUB_REPOSITORY" \
              --json isDraft --jq '.isDraft')" != "true" ]; then
              echo "Release $TAG is already published; bump the version in package.json." >&2
              exit 1
            fi
            test "$(gh release view "$TAG" --repo "$GITHUB_REPOSITORY" \
              --json isPrerelease --jq '.isPrerelease')" = "$PRERELEASE"
            test "$(gh release view "$TAG" --repo "$GITHUB_REPOSITORY" \
              --json targetCommitish --jq '.targetCommitish')" = "$GITHUB_SHA"
            local_assets="$(find release-assets -maxdepth 1 -type f \
              -exec basename {} \; | sort)"
            remote_assets="$(gh release view "$TAG" --repo "$GITHUB_REPOSITORY" \
              --json assets --jq '.assets[].name' | sort)"
            test "$remote_assets" = "$local_assets"
            echo "create=false" >> "$GITHUB_OUTPUT"
          else
            if gh api "repos/$GITHUB_REPOSITORY/git/ref/tags/$TAG" >/dev/null 2>&1; then
              echo "Tag $TAG exists without a resumable draft release." >&2
              exit 1
            fi
            echo "create=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Attest ZIP provenance and SBOM
        if: steps.release-state.outputs.create == 'true'
        uses: actions/attest@f7c74d28b9d84cb8768d0b8ca14a4bac6ef463e6 # v4
        with:
          subject-path: release-assets/*.zip
          sbom-path: ${{ steps.release-state.outputs.sbom }}

      - name: Attest DMG provenance
        if: steps.release-state.outputs.create == 'true'
        uses: actions/attest@f7c74d28b9d84cb8768d0b8ca14a4bac6ef463e6 # v4
        with:
          subject-path: release-assets/*.dmg

      - name: Create complete draft release
        if: steps.release-state.outputs.create == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          PRERELEASE: ${{ needs.release-build.outputs.prerelease }}
          TAG: ${{ needs.release-build.outputs.tag }}
        run: |
          args=(--repo "$GITHUB_REPOSITORY" --target "$GITHUB_SHA" \
            --title "$TAG" --draft --generate-notes)
          if [ "$PRERELEASE" = "true" ]; then
            args+=(--prerelease --latest=false)
          fi
          gh release create "$TAG" "${args[@]}" release-assets/*

      - name: Verify remote release and publish atomically
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ needs.release-build.outputs.tag }}
        run: |
          expected="$(find release-assets -maxdepth 1 -type f | wc -l | tr -d ' ')"
          actual="$(gh release view "$TAG" --repo "$GITHUB_REPOSITORY" \
            --json assets --jq '.assets | length')"
          test "$actual" = "$expected"
          remote="$RUNNER_TEMP/remote-assets"
          mkdir -p "$remote"
          gh release download "$TAG" --repo "$GITHUB_REPOSITORY" --dir "$remote"
          (
            cd "$remote"
            shasum -a 256 -c SHA256SUMS.txt
          )
          cmp release-assets/RELEASES.json "$remote/RELEASES.json"
          gh release edit "$TAG" --repo "$GITHUB_REPOSITORY" --draft=false
