name: macOS

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: macos-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  verify:
    runs-on: macos-15
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - name: Review dependency changes
        if: github.event_name == 'pull_request'
        uses: actions/dependency-review-action@cc4f6536e38d1126c5e3b0683d469a14f23bfea4 # v3.1.5
        with:
          fail-on-severity: high
      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4
        with:
          version: 11.13.1
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: "24"
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm audit --audit-level=high
      - run: pnpm verify

  release-build:
    if: github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main'
    needs: verify
    runs-on: macos-15
    timeout-minutes: 45
    permissions:
      contents: read
      actions: read
    outputs:
      prerelease: ${{ steps.version.outputs.prerelease }}
      tag: ${{ steps.version.outputs.tag }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4
        with:
          version: 11.13.1
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: "24"
          cache: pnpm

      # GitHub disables scheduled workflows in a repository that has been quiet
      # for 60 days, and a canary that stopped running looks exactly like a
      # canary that keeps passing. Only the last successful run tells the two
      # apart, and GitHub already keeps that timestamp; a copy committed here
      # would need a scheduled job with write access to stay true, which is the
      # permission this repository deliberately withholds from the canary.
      # The age is computed in Node so that no wall clock reaches the release
      # version, which comes from package.json and nowhere else.
      - name: Require a client canary newer than 14 days
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          runs="repos/$GITHUB_REPOSITORY/actions/workflows/client-canary.yml/runs"
          started="$(gh api \
            "$runs?status=success&branch=$GITHUB_REF_NAME&per_page=1" \
            --jq '.workflow_runs[0].run_started_at // ""')"
          if [ -z "$started" ]; then
            echo "No ArenaNet client canary has ever succeeded on $GITHUB_REF_NAME." >&2
            echo "Run the 'ArenaNet client canary' workflow, then release." >&2
            exit 1
          fi
          age="$(node -e '
            const started = Date.parse(process.argv[1]);
            if (Number.isNaN(started)) {
              console.error(`unreadable canary timestamp: ${process.argv[1]}`);
              process.exit(1);
            }
            console.log(Math.floor((Date.now() - started) / 86400000));
          ' "$started")"
          echo "Last successful ArenaNet client canary: $started ($age days ago)."
          if [ "$age" -gt 14 ]; then
            echo "The canary has not passed for $age days, so nothing here has" >&2
            echo "met ArenaNet's current client. Re-run the 'ArenaNet client" >&2
            echo "canary' workflow and release once it is green." >&2
            exit 1
          fi

      # Before install, because it needs neither: a bad version should cost
      # seconds, not a full build. scripts/macos-version.ts is the one owner of
      # what a release version may be — it rejects leading zeroes, months that
      # are not months, and anything that cannot become a valid CFBundleVersion.
      # `pnpm make` reaches the same function through forge.config.ts, so a
      # second regex here could only ever disagree with the build.
      #
      # It is TypeScript, so this runs under the repository's one loader — the
      # same two flags package.json's script entries carry. Both files are
      # tracked, so this still needs no install.
      - name: Resolve release version
        id: version
        run: |
          version="$(node -p "require('./package.json').version")"
          node --import ./scripts/ts-hook.mjs --experimental-strip-types -e '
            const { macOSBundleVersions } = await import("./scripts/macos-version.js");
            try {
              const { appVersion, buildVersion } = macOSBundleVersions(process.argv[1]);
              console.log(`CFBundleShortVersionString ${appVersion}`);
              console.log(`CFBundleVersion ${buildVersion}`);
            } catch (error) {
              console.error(`package.json contains an invalid release version: ${error.message}`);
              process.exit(1);
            }
          ' "$version"
          tag="v$version"
          prerelease=false
          if [[ "$version" == *-* ]]; then
            prerelease=true
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "tag=$tag" >> "$GITHUB_OUTPUT"
          echo "prerelease=$prerelease" >> "$GITHUB_OUTPUT"

      - run: pnpm install --frozen-lockfile

      - name: Build release candidate
        run: pnpm make

      - name: Smoke-test release candidate
        run: pnpm test:packaged

      - name: Verify code signature
        run: |
          app="$(find out -name 'Guild Wars.app' -type d -print -quit)"
          test -n "$app"
          codesign --verify --deep --strict --verbose=2 "$app"
          signature="$(codesign -dv --verbose=4 "$app" 2>&1)"
          echo "$signature"
          echo "$signature" | grep -E "Signature=adhoc|TeamIdentifier=not set"

      - name: Prepare release assets
        id: assets
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          asset_count="$(find out/make -type f -name '*.zip' | wc -l | tr -d ' ')"
          if [ "$asset_count" != "1" ]; then
            echo "Expected exactly one ZIP, found $asset_count." >&2
            exit 1
          fi
          asset="$(find out/make -type f -name '*.zip' -print -quit)"
          asset_dir="$(dirname "$asset")"
          app="$(find out -name 'Guild Wars.app' -type d -print -quit)"
          test -n "$app"
          sbom="$asset_dir/Guild-Wars-$VERSION-macOS-arm64.spdx.json"
          checksum="$asset_dir/SHA256SUMS.txt"
          echo "asset=$asset" >> "$GITHUB_OUTPUT"
          echo "app=$app" >> "$GITHUB_OUTPUT"
          echo "sbom=$sbom" >> "$GITHUB_OUTPUT"
          echo "checksum=$checksum" >> "$GITHUB_OUTPUT"

      - name: Generate SPDX SBOM
        uses: anchore/sbom-action@e22c389904149dbc22b58101806040fa8d37a610 # v0
        with:
          path: ${{ steps.assets.outputs.app }}
          format: spdx-json
          output-file: ${{ steps.assets.outputs.sbom }}
          upload-artifact: false
          upload-release-assets: false

      - name: Finalize release checksums
        env:
          ASSET: ${{ steps.assets.outputs.asset }}
          CHECKSUM: ${{ steps.assets.outputs.checksum }}
          SBOM: ${{ steps.assets.outputs.sbom }}
        run: |
          asset_dir="$(dirname "$ASSET")"
          (
            cd "$asset_dir"
            shasum -a 256 "$(basename "$ASSET")" "$(basename "$SBOM")" \
              > "$(basename "$CHECKSUM")"
            shasum -a 256 -c "$(basename "$CHECKSUM")"
          )

      - name: Handoff verified release assets
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: release-assets
          path: |
            ${{ steps.assets.outputs.asset }}
            ${{ steps.assets.outputs.checksum }}
            ${{ steps.assets.outputs.sbom }}
          if-no-files-found: error
          retention-days: 1
          compression-level: 0

  release:
    if: github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main'
    needs: release-build
    runs-on: macos-15
    timeout-minutes: 10
    permissions:
      attestations: write
      artifact-metadata: write
      contents: write
      id-token: write
    steps:
      - name: Receive verified release assets
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: release-assets
          path: release-assets

      - name: Resolve and verify handoff
        id: assets
        env:
          TAG: ${{ needs.release-build.outputs.tag }}
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh api "repos/$GITHUB_REPOSITORY/git/ref/tags/$TAG" >/dev/null 2>&1 ||
             gh release view "$TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            echo "Tag or release $TAG already exists." >&2
            exit 1
          fi
          asset_count="$(find release-assets -type f -name '*.zip' | wc -l | tr -d ' ')"
          sbom_count="$(find release-assets -type f -name '*.spdx.json' | wc -l | tr -d ' ')"
          test "$asset_count" = "1"
          test "$sbom_count" = "1"
          asset="$(find release-assets -type f -name '*.zip' -print -quit)"
          sbom="$(find release-assets -type f -name '*.spdx.json' -print -quit)"
          checksum="release-assets/SHA256SUMS.txt"
          test -f "$checksum"
          (
            cd release-assets
            shasum -a 256 -c SHA256SUMS.txt
          )
          echo "asset=$asset" >> "$GITHUB_OUTPUT"
          echo "sbom=$sbom" >> "$GITHUB_OUTPUT"
          echo "checksum=$checksum" >> "$GITHUB_OUTPUT"

      - name: Attest release provenance
        uses: actions/attest@f7c74d28b9d84cb8768d0b8ca14a4bac6ef463e6 # v4
        with:
          subject-path: ${{ steps.assets.outputs.asset }}

      - name: Attest release SBOM
        uses: actions/attest@f7c74d28b9d84cb8768d0b8ca14a4bac6ef463e6 # v4
        with:
          subject-path: ${{ steps.assets.outputs.asset }}
          sbom-path: ${{ steps.assets.outputs.sbom }}

      - name: Publish GitHub release
        env:
          ASSET: ${{ steps.assets.outputs.asset }}
          CHECKSUM: ${{ steps.assets.outputs.checksum }}
          SBOM: ${{ steps.assets.outputs.sbom }}
          GH_TOKEN: ${{ github.token }}
          PRERELEASE: ${{ needs.release-build.outputs.prerelease }}
          TAG: ${{ needs.release-build.outputs.tag }}
        run: |
          notes=""
          release_args=(--repo "$GITHUB_REPOSITORY" --target "$GITHUB_SHA" --title "$TAG")
          if [ "$PRERELEASE" = "true" ]; then
            release_args+=(--prerelease --latest=false)
            notes="> [!WARNING]
          > This is a prerelease build. Back up important data and expect bugs."
          fi
          signing_note="> [!NOTE]
          > This build is ad-hoc signed, not notarized by Apple. macOS blocks the
          > first launch; follow the install guide for the one-time per-app
          > approval. Do not disable Gatekeeper."
          if [ -n "$notes" ]; then
            notes="$notes

          $signing_note"
          else
            notes="$signing_note"
          fi
          notes="$notes

          Every release includes SHA-256 checksums, an SPDX SBOM, and GitHub
          build/SBOM attestations. See the install guide for verification."
          gh release create "$TAG" "$ASSET" "$CHECKSUM" "$SBOM" \
            "${release_args[@]}" \
            --generate-notes \
            --notes "$notes"
