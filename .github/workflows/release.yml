# The only path to a public versioned release: dispatched by hand, refused off
# main, and gated on the approval environment holding the Developer ID material.
name: Versioned release

on:
  workflow_dispatch:
    inputs:
      dry_run:
        # Proves the whole release path — the same build, signing,
        # notarization, stapling, and verification a release runs — without
        # creating a tag, a release, or an attestation. It skips only the two
        # GitHub-mutation jobs, so a passing dry run exercises the real build
        # and package checks rather than a second path.
        description: Build and verify the release, then publish nothing.
        default: false
        type: boolean

permissions:
  contents: read

concurrency:
  group: versioned-release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  verify:
    uses: ./.github/workflows/macos-verify.yml
    with:
      artifact-name: ""

  release-build:
    if: github.ref == 'refs/heads/main'
    needs: verify
    runs-on: macos-15
    timeout-minutes: 60
    environment: release
    permissions:
      actions: read
      contents: read
    outputs:
      release-assets-name: ${{ steps.release-artifact.outputs.name }}
      bundle-version: ${{ steps.version.outputs.bundle-version }}
      client-generation: ${{ steps.official-client.outputs.fingerprint }}
      prerelease: ${{ steps.version.outputs.prerelease }}
      tag: ${{ steps.version.outputs.tag }}
      version: ${{ steps.version.outputs.version }}
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@d15e628ca66d93ee5f352c71671a7bc6a97af5c9 # v6.0.8
      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: "24"
          cache: pnpm

      - name: Require Apple Silicon runner
        run: test "$(uname -m)" = "arm64"

      # The runner image's default toolchain is not this repository's. Installs
      # the one rust-toolchain.toml names, with no version repeated here.
      - name: Install the pinned Rust toolchain
        run: rustup toolchain install

      - name: Resolve release version
        id: version
        run: |
          version="$(node -p "require('./package.json').version")"
          bundle_version="$(node --import ./scripts/ts-hook.mjs -e '
            const { macOSBundleVersions } = await import("./scripts/macos-version.js");
            console.log(macOSBundleVersions(process.argv[1]).buildVersion);
          ' "$version")"
          prerelease=false
          if [[ "$version" == *-* ]]; then prerelease=true; fi
          if [[ "$version" == *-alpha.* ]]; then
            echo "Alpha builds are internal snapshots, not public releases." >&2
            exit 1
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "bundle-version=$bundle_version" >> "$GITHUB_OUTPUT"
          echo "tag=v$version" >> "$GITHUB_OUTPUT"
          echo "prerelease=$prerelease" >> "$GITHUB_OUTPUT"

      # The same refusal the release job enforces before publishing, moved
      # ahead of the build so a forgotten version bump fails in seconds, not
      # after signing and notarization. This job's read-only token cannot see
      # draft releases, so a resumable draft passes through here and is
      # verified by the release job's own check.
      - name: Refuse a version that already shipped
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.version.outputs.tag }}
        run: |
          if gh release view "$TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            if [ "$(gh release view "$TAG" --repo "$GITHUB_REPOSITORY" \
              --json isDraft --jq '.isDraft')" != "true" ]; then
              echo "Release $TAG is already published; bump the version in package.json." >&2
              exit 1
            fi
            echo "Draft release $TAG exists; this run will resume it."
          elif gh api "repos/$GITHUB_REPOSITORY/git/ref/tags/$TAG" >/dev/null 2>&1; then
            echo "Tag $TAG exists without a resumable draft release." >&2
            exit 1
          fi

      - run: pnpm install --frozen-lockfile

      - name: Download the current ArenaNet client generation
        id: official-client
        run: pnpm client:official --download "$RUNNER_TEMP/release-client"

      - name: Qualify the exact ArenaNet client before packaging
        env:
          GW_CLIENT_JS: ${{ steps.official-client.outputs.js }}
          GW_CLIENT_WASM: ${{ steps.official-client.outputs.wasm }}
        run: |
          pnpm build
          node build/tools/certification.js verify "$GW_CLIENT_WASM"
          node build/tools/certification.js double-click "$GW_CLIENT_WASM"
          pnpm test:client-artifact
          pnpm memory:qualify:4gb "$GW_CLIENT_JS" "$GW_CLIENT_WASM"

      - name: Refuse a client generation that changed during qualification
        env:
          QUALIFIED_GENERATION: ${{ steps.official-client.outputs.fingerprint }}
        run: |
          current="$(pnpm --silent client:official | node -e '
            let input = "";
            process.stdin.on("data", chunk => input += chunk);
            process.stdin.on("end", () => console.log(JSON.parse(input).fingerprint));
          ')"
          test "$current" = "$QUALIFIED_GENERATION"

      - name: Import Developer ID and notarization credentials
        env:
          CERTIFICATE_B64: ${{ secrets.APPLE_DEVELOPER_ID_P12 }}
          CERTIFICATE_PASSWORD: ${{ secrets.APPLE_DEVELOPER_ID_PASSWORD }}
          PROFILE_B64: ${{ secrets.APPLE_DEVELOPER_ID_PROFILE }}
          NOTARY_KEY_B64: ${{ secrets.APPLE_API_KEY_P8 }}
          API_KEY_ID: ${{ secrets.APPLE_API_KEY_ID }}
          API_ISSUER_ID: ${{ secrets.APPLE_API_ISSUER_ID }}
          TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: |
          umask 077
          test -n "$CERTIFICATE_B64"
          test -n "$CERTIFICATE_PASSWORD"
          test -n "$PROFILE_B64"
          test -n "$NOTARY_KEY_B64"
          test -n "$API_KEY_ID"
          test -n "$API_ISSUER_ID"
          test -n "$TEAM_ID"
          test "$TEAM_ID" = "9NN976MFZ4"
          keychain="$RUNNER_TEMP/gwonmac-release-$(openssl rand -hex 16).keychain-db"
          original_keychain="$(security default-keychain -d user | tr -d '\" ')"
          test -n "$original_keychain"
          certificate="$RUNNER_TEMP/developer-id.p12"
          profile="$RUNNER_TEMP/gwonmac.provisionprofile"
          profile_plist="$RUNNER_TEMP/gwonmac-profile.plist"
          api_key="$RUNNER_TEMP/AuthKey_${API_KEY_ID}.p8"
          {
            echo "APPLE_KEYCHAIN=$keychain"
            echo "APPLE_ORIGINAL_KEYCHAIN=$original_keychain"
            echo "APPLE_CERTIFICATE_PATH=$certificate"
            echo "APPLE_PROVISIONING_PROFILE=$profile"
            echo "APPLE_PROFILE_PLIST=$profile_plist"
            echo "APPLE_API_KEY_PATH=$api_key"
            echo "APPLE_API_KEY_ID=$API_KEY_ID"
            echo "APPLE_API_ISSUER_ID=$API_ISSUER_ID"
            echo "APPLE_TEAM_ID=$TEAM_ID"
            echo "APPLE_SIGNING_IDENTITY=7F9A56793C16683742AA7818FE65221A884FA108"
          } >> "$GITHUB_ENV"
          keychain_password="$(openssl rand -hex 32)"
          printf '%s' "$CERTIFICATE_B64" | base64 --decode > "$certificate"
          printf '%s' "$PROFILE_B64" | base64 --decode > "$profile"
          printf '%s' "$NOTARY_KEY_B64" | base64 --decode > "$api_key"
          chmod 600 "$certificate" "$profile" "$api_key"
          security cms -D -i "$profile" > "$profile_plist"
          test "$(plutil -extract TeamIdentifier.0 raw -o - "$profile_plist")" = \
            "9NN976MFZ4"
          test "$(plutil -extract ProvisionsAllDevices raw -o - "$profile_plist")" = \
            "true"
          test "$(/usr/libexec/PlistBuddy -c \
            'Print :Entitlements:com.apple.application-identifier' \
            "$profile_plist")" = "9NN976MFZ4.io.github.mat4m0.gwonmac"
          test "$(/usr/libexec/PlistBuddy -c \
            'Print :Entitlements:com.apple.developer.team-identifier' \
            "$profile_plist")" = "9NN976MFZ4"
          expiry="$(plutil -extract ExpirationDate raw -o - "$profile_plist")"
          node -e '
            const remaining = Date.parse(process.argv[1]) - Date.now();
            if (remaining <= 2 * 365 * 86400000) process.exit(1);
            if (remaining <= 5 * 365 * 86400000) {
              console.log("::warning::Developer ID profile expires within five years");
            }
          ' "$expiry"
          profile_certificate="$RUNNER_TEMP/profile-certificate.der"
          plutil -extract DeveloperCertificates.0 raw -o - "$profile_plist" |
            base64 --decode > "$profile_certificate"
          test "$(shasum "$profile_certificate" | awk '{print toupper($1)}')" = \
            "7F9A56793C16683742AA7818FE65221A884FA108"
          rm -f "$profile_certificate"
          if plutil -extract DeveloperCertificates.1 raw -o /dev/null \
            "$profile_plist" 2>/dev/null; then
            echo "Provisioning profile contains an unexpected certificate." >&2
            exit 1
          fi
          security create-keychain -p "$keychain_password" "$keychain"
          security set-keychain-settings -lut 21600 "$keychain"
          security unlock-keychain -p "$keychain_password" "$keychain"
          security import "$certificate" -k "$keychain" \
            -P "$CERTIFICATE_PASSWORD" -T /usr/bin/codesign -T /usr/bin/security
          security set-key-partition-list \
            -S apple-tool:,apple:,codesign: -s \
            -k "$keychain_password" "$keychain"
          security list-keychains -d user -s "$keychain"
          security default-keychain -d user -s "$keychain"
          security find-identity -v -p codesigning "$keychain" |
            grep '7F9A56793C16683742AA7818FE65221A884FA108.*Developer ID Application: Matthias Amon (9NN976MFZ4)'
          security find-certificate -c \
            'Developer ID Application: Matthias Amon (9NN976MFZ4)' \
            -Z "$keychain" | grep '7F9A56793C16683742AA7818FE65221A884FA108'
          rm -f "$certificate"

      - name: Build, sign, notarize, and staple application
        env:
          GW_PACKAGE_INTENT: release
        run: pnpm make

      - name: Notarize and staple DMG
        run: |
          dmg_count="$(find out/make -type f -name '*.dmg' | wc -l | tr -d ' ')"
          test "$dmg_count" = "1"
          dmg="$(find out/make -type f -name '*.dmg' -print -quit)"
          xcrun notarytool submit "$dmg" --wait \
            --key "$APPLE_API_KEY_PATH" \
            --key-id "$APPLE_API_KEY_ID" \
            --issuer "$APPLE_API_ISSUER_ID"
          xcrun stapler staple -v "$dmg"

      # Every assertion this makes lives in scripts/verify-signed-app.ts, so a
      # release that fails one can be reproduced against the same package on a
      # developer's machine instead of only by cutting another release.
      - name: Verify Apple distribution identity and tickets
        env:
          GW_SIGNED_CHANNEL: release
        run: |
          app="$(find out -name 'Guild Wars Reforged.app' -type d -print -quit)"
          zip="$(find out/make -type f -name '*.zip' -print -quit)"
          dmg="$(find out/make -type f -name '*.dmg' -print -quit)"
          unzip_dir="$RUNNER_TEMP/verified-release-zip"
          test -n "$app"
          test -n "$zip"
          test -n "$dmg"
          ditto -x -k "$zip" "$unzip_dir"
          pnpm verify:signed-app \
            "$app" "$dmg"
          pnpm verify:signed-app \
            "$unzip_dir/Guild Wars Reforged.app"
          mount="$RUNNER_TEMP/verified-release-dmg"
          mkdir -p "$mount"
          hdiutil attach "$dmg" -readonly -nobrowse -mountpoint "$mount"
          trap 'hdiutil detach "$mount"' EXIT
          diff -qr \
            "$unzip_dir/Guild Wars Reforged.app" \
            "$mount/Guild Wars Reforged.app"
          hdiutil detach "$mount"
          trap - EXIT

      - name: Prepare signed Keychain replacement fixture
        id: runtime-fixture
        env:
          GW_SIGN_CHANNEL: release
        run: |
          app="$(find out -name 'Guild Wars Reforged.app' -type d -print -quit)"
          replacement="$RUNNER_TEMP/release-replacement/Guild Wars Reforged.app"
          test -d "$app"
          mkdir -p "$(dirname "$replacement")"
          ditto "$app" "$replacement"
          rm "$replacement/Contents/Resources/distribution-channel.json"
          printf 'newly signed replacement\n' > \
            "$replacement/Contents/Resources/upgrade-proof"
          GW_SIGN_APP_PATH="$replacement" \
            node --import ./scripts/ts-hook.mjs \
            scripts/sign-distribution-app.ts
          codesign --verify --deep --strict --verbose=2 "$replacement"
          cmp "$APPLE_PROVISIONING_PROFILE" \
            "$replacement/Contents/embedded.provisionprofile"
          echo "replacement=$replacement" >> "$GITHUB_OUTPUT"

      - name: Remove signing material before non-signing work
        run: |
          security default-keychain -d user -s "$APPLE_ORIGINAL_KEYCHAIN"
          security list-keychains -d user -s "$APPLE_ORIGINAL_KEYCHAIN"
          security delete-keychain "$APPLE_KEYCHAIN"
          rm -f "$APPLE_CERTIFICATE_PATH" "$APPLE_API_KEY_PATH" \
            "$APPLE_PROVISIONING_PROFILE" "$APPLE_PROFILE_PLIST"
          {
            echo "APPLE_KEYCHAIN="
            echo "APPLE_CERTIFICATE_PATH="
            echo "APPLE_API_KEY_PATH="
            echo "APPLE_PROVISIONING_PROFILE="
            echo "APPLE_PROFILE_PLIST="
          } >> "$GITHUB_ENV"

      - name: Prepare checksum-pinned release assets
        id: assets
        env:
          VERSION: ${{ steps.version.outputs.version }}
          TAG: ${{ steps.version.outputs.tag }}
        run: |
          asset_dir="$RUNNER_TEMP/release-assets"
          mkdir -p "$asset_dir"
          app="$(find out -name 'Guild Wars Reforged.app' -type d -print -quit)"
          zip_source="$(find out/make -type f -name '*.zip' -print -quit)"
          dmg_source="$(find out/make -type f -name '*.dmg' -print -quit)"
          test -n "$app"
          test -n "$zip_source"
          test -n "$dmg_source"
          zip="$asset_dir/Guild-Wars-Reforged-$VERSION-macOS-arm64.zip"
          dmg="$asset_dir/Guild-Wars-Reforged-$VERSION-macOS-arm64.dmg"
          cp "$zip_source" "$zip"
          cp "$dmg_source" "$dmg"
          manifest="$asset_dir/RELEASES.json"
          published_at="$(git show -s --format=%cI "$GITHUB_SHA")"
          node --import ./scripts/ts-hook.mjs \
            scripts/release-manifest.ts \
            "$VERSION" "$TAG" "$(basename "$zip")" "$published_at" "$manifest"
          sbom="$asset_dir/Guild-Wars-Reforged-$VERSION-macOS-arm64.spdx.json"
          checksum="$asset_dir/SHA256SUMS.txt"
          {
            echo "asset_dir=$asset_dir"
            echo "app=$app"
            echo "zip=$zip"
            echo "dmg=$dmg"
            echo "manifest=$manifest"
            echo "sbom=$sbom"
            echo "checksum=$checksum"
          } >> "$GITHUB_OUTPUT"

      - name: Generate SPDX SBOM
        uses: anchore/sbom-action@e22c389904149dbc22b58101806040fa8d37a610 # v0
        with:
          path: ${{ steps.assets.outputs.app }}
          format: spdx-json
          output-file: ${{ steps.assets.outputs.sbom }}
          upload-artifact: false
          upload-release-assets: false

      - name: Finalize checksums
        env:
          ASSET_DIR: ${{ steps.assets.outputs.asset_dir }}
        run: |
          (
            cd "$ASSET_DIR"
            shasum -a 256 *.zip *.dmg RELEASES.json *.spdx.json > SHA256SUMS.txt
            shasum -a 256 -c SHA256SUMS.txt
          )

      # A dry run publishes nothing, so this is the only account it leaves of
      # what it built and what the verification covered.
      - name: Summarize built and verified assets
        env:
          ASSET_DIR: ${{ steps.assets.outputs.asset_dir }}
          DRY_RUN: ${{ inputs.dry_run }}
          TAG: ${{ steps.version.outputs.tag }}
        run: |
          outcome="built, signed, notarized, stapled, and verified"
          if [ "$DRY_RUN" = "true" ]; then
            headline="Dry run of $TAG: $outcome. Nothing published."
          else
            headline="$TAG: $outcome."
          fi
          {
            echo "### Release assets"
            echo
            echo "$headline"
            echo
            echo '```'
            cat "$ASSET_DIR/SHA256SUMS.txt"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Retain debug symbols
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: release-dsyms-${{ github.run_id }}-${{ github.run_attempt }}
          path: out/**/*.dSYM
          if-no-files-found: warn
          retention-days: 30

      - name: Resolve release artifact name
        id: release-artifact
        run: echo "name=release-assets-$GITHUB_RUN_ID-$GITHUB_RUN_ATTEMPT" >> "$GITHUB_OUTPUT"

      - name: Handoff verified release assets
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: ${{ steps.release-artifact.outputs.name }}
          path: ${{ steps.assets.outputs.asset_dir }}
          if-no-files-found: error
          retention-days: 1
          compression-level: 0

      - name: Smoke-test signed release candidate without signing secrets
        env:
          GW_CLIENT_JS: ${{ steps.official-client.outputs.js }}
          GW_CLIENT_WASM: ${{ steps.official-client.outputs.wasm }}
          GW_PACKAGE_INTENT: release
        run: |
          pnpm test:packaged
          # Re-run the exact official generation after packaging through the
          # same verifier, planner, transforms, and integrity-checked cache
          # path used by production. The test also corrupts the final cache
          # and requires deterministic reconstruction before publication.
          node --import ./scripts/ts-hook.mjs --test --test-timeout=60000 \
            tests/client-artifact/client-chain-qualification.test.ts

      - name: Prove signed Data Protection Keychain continuity without signing secrets
        env:
          GW_SIGNED_APP_PATH: ${{ steps.assets.outputs.app }}
          GW_SIGNED_REPLACEMENT_APP_PATH: ${{ steps.runtime-fixture.outputs.replacement }}
          GW_SIGNED_CHANNEL: release
        run: pnpm test:signed-keychain

      # Every public beta/RC must be a reversible data experiment even though
      # replacing the binary with an older Stable remains a manual action.
      # The latest published Stable creates the data, this exact signed
      # candidate changes it, then the same Stable must read and write it again.
      - name: Prove beta data returns to latest Stable without signing secrets
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ steps.version.outputs.version }}
          GW_SIGNED_CHANNEL: release
        run: |
          case "$VERSION" in
            *-beta.*|*-rc.*) ;;
            *) echo "Stable release: recurring Stable/Beta round-trip not required."; exit 0 ;;
          esac
          stable_dir="$RUNNER_TEMP/latest-stable"
          mkdir -p "$stable_dir"
          stable_tag="$(gh api "repos/$GITHUB_REPOSITORY/releases/latest" --jq .tag_name)"
          case "$stable_tag" in
            v*) stable_version="${stable_tag#v}" ;;
            *) echo "Latest Stable tag is not canonical: $stable_tag" >&2; exit 1 ;;
          esac
          stable_zip_name="Guild-Wars-Reforged-${stable_version}-macOS-arm64.zip"
          gh release download "$stable_tag" --repo "$GITHUB_REPOSITORY" \
            --pattern "$stable_zip_name" \
            --dir "$stable_dir"
          stable_zip_count="$(find "$stable_dir" -maxdepth 1 -name '*.zip' | wc -l | tr -d ' ')"
          test "$stable_zip_count" = "1"
          stable_zip="$(find "$stable_dir" -maxdepth 1 -name '*.zip' -print -quit)"
          gh attestation verify "$stable_zip" --repo "$GITHUB_REPOSITORY"
          stable_sha="$(shasum -a 256 "$stable_zip" | awk '{print $1}')"
          {
            echo "### Stable/Beta compatibility baseline"
            echo
            echo "Latest Stable: \`$stable_tag\` (ZIP SHA-256 \`$stable_sha\`)"
          } >> "$GITHUB_STEP_SUMMARY"
          ditto -x -k "$stable_zip" "$stable_dir/unpacked"
          stable_app="$stable_dir/unpacked/Guild Wars Reforged.app"
          candidate_count="$(find out -name 'Guild Wars Reforged.app' -type d | wc -l | tr -d ' ')"
          test "$candidate_count" = "1"
          candidate_app="$(find out -name 'Guild Wars Reforged.app' -type d -print -quit)"
          test -d "$stable_app"
          test -d "$candidate_app"
          APPLE_PROVISIONING_PROFILE="$stable_app/Contents/embedded.provisionprofile" \
            pnpm verify:signed-app "$stable_app"
          # Neither tested app needs GitHub authority. The launcher inherits
          # this shell's environment, so remove the step token first.
          unset GH_TOKEN
          GW_STABLE_APP_PATH="$stable_app" \
          GW_STABLE_VERSION="$stable_version" \
          GW_CANDIDATE_APP_PATH="$candidate_app" \
          GW_CANDIDATE_VERSION="$VERSION" \
            pnpm test:stable-beta-roundtrip

      - name: Delete temporary signing material
        if: always()
        run: |
          if [ -n "${APPLE_ORIGINAL_KEYCHAIN:-}" ]; then
            security default-keychain -d user -s "$APPLE_ORIGINAL_KEYCHAIN" || true
            security list-keychains -d user -s "$APPLE_ORIGINAL_KEYCHAIN" || true
          fi
          if [ -n "${APPLE_KEYCHAIN:-}" ]; then
            security delete-keychain "$APPLE_KEYCHAIN" || true
          fi
          rm -f "${APPLE_CERTIFICATE_PATH:-}" "${APPLE_API_KEY_PATH:-}" \
            "${APPLE_PROVISIONING_PROFILE:-}" "${APPLE_PROFILE_PLIST:-}"

  # Stage the exact signed output as a complete GitHub draft. The draft is not
  # eligible for the website or AppUpdater and gives the release approver one
  # checksum-pinned candidate to test before the separate publish decision.
  stage-release:
    if: github.ref == 'refs/heads/main' && !inputs.dry_run
    needs: release-build
    runs-on: macos-15
    timeout-minutes: 15
    outputs:
      checksums-sha256: ${{ steps.draft.outputs.checksums-sha256 }}
      workflow-url: ${{ steps.verification.outputs.workflow-url }}
    permissions:
      attestations: write
      artifact-metadata: write
      contents: write
      id-token: write
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false
      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: "24"
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          # A failed-jobs-only rerun reuses the successful build from its
          # original attempt. Consume that job's stored name instead of the
          # staging attempt number, which can be newer.
          name: ${{ needs.release-build.outputs.release-assets-name }}
          path: release-assets

      - name: Verify handoff and resolve draft release
        id: release-state
        env:
          GH_TOKEN: ${{ github.token }}
          PRERELEASE: ${{ needs.release-build.outputs.prerelease }}
          TAG: ${{ needs.release-build.outputs.tag }}
        run: |
          (
            cd release-assets
            test "$(find . -maxdepth 1 -name '*.zip' | wc -l | tr -d ' ')" = "1"
            test "$(find . -maxdepth 1 -name '*.dmg' | wc -l | tr -d ' ')" = "1"
            test -f RELEASES.json
            test -f SHA256SUMS.txt
            shasum -a 256 -c SHA256SUMS.txt
          )
          sbom_count="$(find release-assets -maxdepth 1 -type f -name '*.spdx.json' |
            wc -l | tr -d ' ')"
          test "$sbom_count" = "1"
          sbom="$(find release-assets -maxdepth 1 -type f -name '*.spdx.json' -print -quit)"
          echo "sbom=$sbom" >> "$GITHUB_OUTPUT"
          if gh release view "$TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            if [ "$(gh release view "$TAG" --repo "$GITHUB_REPOSITORY" \
              --json isDraft --jq '.isDraft')" != "true" ]; then
              echo "Release $TAG is already published; bump the version in package.json." >&2
              exit 1
            fi
            test "$(gh release view "$TAG" --repo "$GITHUB_REPOSITORY" \
              --json isPrerelease --jq '.isPrerelease')" = "$PRERELEASE"
            draft_target="$(gh release view "$TAG" --repo "$GITHUB_REPOSITORY" \
              --json targetCommitish --jq '.targetCommitish')"
            if [ "$draft_target" != "$GITHUB_SHA" ]; then
              echo "Draft $TAG targets $draft_target; this run targets $GITHUB_SHA. Delete the obsolete unpublished draft before retrying." >&2
              exit 1
            fi
            local_assets="$(find release-assets -maxdepth 1 -type f \
              -exec basename {} \; | sort)"
            remote_assets="$(gh release view "$TAG" --repo "$GITHUB_REPOSITORY" \
              --json assets --jq '.assets[].name' | sort)"
            test "$remote_assets" = "$local_assets"
            echo "create=false" >> "$GITHUB_OUTPUT"
          else
            if gh api "repos/$GITHUB_REPOSITORY/git/ref/tags/$TAG" >/dev/null 2>&1; then
              echo "Tag $TAG exists without a resumable draft release." >&2
              exit 1
            fi
            echo "create=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Attest ZIP provenance
        uses: actions/attest@f7c74d28b9d84cb8768d0b8ca14a4bac6ef463e6 # v4
        with:
          subject-path: release-assets/*.zip

      - name: Attest ZIP SBOM
        uses: actions/attest@f7c74d28b9d84cb8768d0b8ca14a4bac6ef463e6 # v4
        with:
          subject-path: release-assets/*.zip
          sbom-path: ${{ steps.release-state.outputs.sbom }}

      - name: Attest DMG provenance
        uses: actions/attest@f7c74d28b9d84cb8768d0b8ca14a4bac6ef463e6 # v4
        with:
          subject-path: release-assets/*.dmg

      - name: Prepare machine-owned Verification record
        id: verification
        env:
          BUNDLE_VERSION: ${{ needs.release-build.outputs.bundle-version }}
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ needs.release-build.outputs.tag }}
          VERSION: ${{ needs.release-build.outputs.version }}
        run: |
          body="$RUNNER_TEMP/release-body.md"
          if [ "${{ steps.release-state.outputs.create }}" = "true" ]; then
            : > "$body"
          else
            gh release view "$TAG" --repo "$GITHUB_REPOSITORY" \
              --json body --jq .body > "$body"
          fi
          output="$RUNNER_TEMP/release-body-with-verification.md"
          workflow_url="$GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID"
          node --import ./scripts/ts-hook.mjs \
            scripts/release-verification-record.ts stage \
            "$body" release-assets/SHA256SUMS.txt "$workflow_url" \
            "$GITHUB_SHA" "$VERSION" "$BUNDLE_VERSION" "$output"
          echo "body=$output" >> "$GITHUB_OUTPUT"
          record_workflow_url="$(node --import ./scripts/ts-hook.mjs \
            scripts/release-verification-record.ts \
            workflow-url "$output")"
          echo "workflow-url=$record_workflow_url" >> "$GITHUB_OUTPUT"

      - name: Create complete draft release
        if: steps.release-state.outputs.create == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          PRERELEASE: ${{ needs.release-build.outputs.prerelease }}
          TAG: ${{ needs.release-build.outputs.tag }}
        run: |
          args=(--repo "$GITHUB_REPOSITORY" --target "$GITHUB_SHA" \
            --title "$TAG" --draft --generate-notes \
            --notes-file "${{ steps.verification.outputs.body }}")
          if [ "$PRERELEASE" = "true" ]; then
            args+=(--prerelease --latest=false)
          fi
          gh release create "$TAG" "${args[@]}" release-assets/*

      - name: Refresh Verification record on resumed draft
        if: steps.release-state.outputs.create == 'false'
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ needs.release-build.outputs.tag }}
        run: |
          gh release edit "$TAG" --repo "$GITHUB_REPOSITORY" \
            --notes-file "${{ steps.verification.outputs.body }}"

      - name: Verify exact remote draft
        id: draft
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ needs.release-build.outputs.tag }}
        run: |
          expected="$(find release-assets -maxdepth 1 -type f | wc -l | tr -d ' ')"
          actual="$(gh release view "$TAG" --repo "$GITHUB_REPOSITORY" \
            --json assets --jq '.assets | length')"
          test "$actual" = "$expected"
          remote="$RUNNER_TEMP/remote-assets"
          mkdir -p "$remote"
          gh release download "$TAG" --repo "$GITHUB_REPOSITORY" --dir "$remote"
          (
            cd "$remote"
            shasum -a 256 -c SHA256SUMS.txt
          )
          cmp release-assets/SHA256SUMS.txt "$remote/SHA256SUMS.txt"
          cmp release-assets/RELEASES.json "$remote/RELEASES.json"
          checksums_sha256="$(shasum -a 256 "$remote/SHA256SUMS.txt" | awk '{print $1}')"
          echo "checksums-sha256=$checksums_sha256" >> "$GITHUB_OUTPUT"
          {
            echo "### Staged release candidate"
            echo
            echo "Draft: \`$TAG\`"
            echo "SHA256SUMS.txt SHA-256: \`$checksums_sha256\`"
            echo
            echo "Test these exact draft assets and add the owned Verification record to the draft release notes before approving publication."
          } >> "$GITHUB_STEP_SUMMARY"

  # Publication is deliberately a second protected decision. It downloads the
  # staged draft again and refuses if any asset or the human-owned Verification
  # record changed or is missing. It never rebuilds or re-uploads an asset.
  release:
    if: github.ref == 'refs/heads/main' && !inputs.dry_run
    needs: [release-build, stage-release]
    runs-on: macos-15
    timeout-minutes: 15
    environment: release
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false
      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: "24"
      - name: Verify staged candidate and publish
        env:
          BUNDLE_VERSION: ${{ needs.release-build.outputs.bundle-version }}
          EXPECTED_CHECKSUMS_SHA256: ${{ needs.stage-release.outputs.checksums-sha256 }}
          EXPECTED_CLIENT_GENERATION: ${{ needs.release-build.outputs.client-generation }}
          EXPECTED_WORKFLOW_URL: ${{ needs.stage-release.outputs.workflow-url }}
          GH_TOKEN: ${{ github.token }}
          PRERELEASE: ${{ needs.release-build.outputs.prerelease }}
          TAG: ${{ needs.release-build.outputs.tag }}
          VERSION: ${{ needs.release-build.outputs.version }}
        run: |
          release_json="$(gh release view "$TAG" --repo "$GITHUB_REPOSITORY" \
            --json body,isDraft,isPrerelease,targetCommitish)"
          test "$(node -p 'JSON.parse(process.argv[1]).isDraft' "$release_json")" = "true"
          test "$(node -p 'JSON.parse(process.argv[1]).isPrerelease' "$release_json")" = "$PRERELEASE"
          test "$(node -p 'JSON.parse(process.argv[1]).targetCommitish' "$release_json")" = "$GITHUB_SHA"
          remote="$RUNNER_TEMP/staged-release"
          mkdir -p "$remote"
          gh release download "$TAG" --repo "$GITHUB_REPOSITORY" --dir "$remote"
          (
            cd "$remote"
            shasum -a 256 -c SHA256SUMS.txt
          )
          expected_assets="$RUNNER_TEMP/expected-release-assets.txt"
          actual_assets="$RUNNER_TEMP/actual-release-assets.txt"
          {
            awk '{$1=""; sub(/^[[:space:]]+/, ""); print}' \
              "$remote/SHA256SUMS.txt"
            echo SHA256SUMS.txt
          } | sort > "$expected_assets"
          find "$remote" -maxdepth 1 -type f -exec basename {} \; \
            | sort > "$actual_assets"
          cmp "$expected_assets" "$actual_assets"
          actual_checksums_sha256="$(shasum -a 256 "$remote/SHA256SUMS.txt" | awk '{print $1}')"
          test "$actual_checksums_sha256" = "$EXPECTED_CHECKSUMS_SHA256"
          body_file="$RUNNER_TEMP/release-body.md"
          node -e 'process.stdout.write(JSON.parse(process.argv[1]).body)' \
            "$release_json" > "$body_file"
          node --import ./scripts/ts-hook.mjs \
            scripts/release-verification-record.ts publish \
            "$body_file" "$remote/SHA256SUMS.txt" "$EXPECTED_WORKFLOW_URL" \
            "$GITHUB_SHA" "$VERSION" "$BUNDLE_VERSION"
          current_client_generation="$(node --import ./scripts/ts-hook.mjs \
            scripts/official-client.ts | node -e '
              let input = "";
              process.stdin.on("data", chunk => input += chunk);
              process.stdin.on("end", () => console.log(JSON.parse(input).fingerprint));
            ')"
          test "$current_client_generation" = "$EXPECTED_CLIENT_GENERATION"
          gh release edit "$TAG" --repo "$GITHUB_REPOSITORY" --draft=false

  publish-update-feeds:
    needs: release
    uses: ./.github/workflows/update-feeds.yml
    permissions:
      contents: read
      pages: write
      id-token: write
