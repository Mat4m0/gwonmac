# Its own workflow so the Preview signing material stays inside one protected
# environment, and so the commit being signed is an input rather than implied.
name: Sign verified Preview package

on:
  workflow_call:
    inputs:
      unsigned-artifact-name:
        required: true
        type: string
      signed-artifact-name:
        required: true
        type: string
      commit-sha:
        required: true
        type: string
      signer-sha:
        required: true
        type: string

permissions:
  contents: read

jobs:
  sign:
    runs-on: macos-15
    timeout-minutes: 45
    environment: snapshot-signing
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          ref: ${{ inputs.signer-sha }}
          persist-credentials: false
      - uses: pnpm/action-setup@d15e628ca66d93ee5f352c71671a7bc6a97af5c9 # v6.0.8
      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: "24"
          cache: pnpm
      - run: pnpm install --frozen-lockfile

      - name: Receive verified unsigned package
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: ${{ inputs.unsigned-artifact-name }}
          path: unsigned-assets

      - name: Verify handoff without executing artifact code
        id: handoff
        env:
          COMMIT_SHA: ${{ inputs.commit-sha }}
          SIGNER_SHA: ${{ inputs.signer-sha }}
        run: |
          if ! [[ "$COMMIT_SHA" =~ ^[0-9a-f]{40}$ ]]; then
            echo "Invalid Preview commit: $COMMIT_SHA" >&2
            exit 1
          fi
          if ! [[ "$SIGNER_SHA" =~ ^[0-9a-f]{40}$ ]]; then
            echo "Invalid trusted signer commit: $SIGNER_SHA" >&2
            exit 1
          fi
          test "$(git rev-parse HEAD)" = "$SIGNER_SHA"
          test "$(tr -d '\n' < unsigned-assets/SOURCE_COMMIT.txt)" = "$COMMIT_SHA"
          (cd unsigned-assets && shasum -a 256 -c SHA256SUMS.txt)
          archive_count="$(find unsigned-assets -type f -name '*.zip' | wc -l | tr -d ' ')"
          test "$archive_count" = "1"
          archive="$(find unsigned-assets -type f -name '*.zip' -print -quit)"
          extract="$RUNNER_TEMP/preview-extracted"
          mkdir -p "$extract"
          ditto -x -k "$archive" "$extract"
          app="$extract/Guild Wars Reforged Preview.app"
          test -d "$app"
          test "$('/usr/libexec/PlistBuddy' -c 'Print :CFBundleIdentifier' \
            "$app/Contents/Info.plist")" = "io.github.mat4m0.gwonmac.preview"
          test ! -e "$app/Contents/Resources/distribution-channel.json"
          signature="$(codesign -dv --verbose=4 "$app" 2>&1)"
          echo "$signature" | grep -E "Signature=adhoc|TeamIdentifier=not set"
          app_root="$(cd "$app" && pwd -P)"
          unexpected="$(find "$app" ! -type f ! -type d ! -type l -print -quit)"
          test -z "$unexpected"
          while IFS= read -r -d '' link; do
            target="$(realpath "$link")"
            case "$target" in
              "$app_root"/*) ;;
              *) echo "External app symlink: $link -> $target" >&2; exit 1 ;;
            esac
          done < <(find "$app" -type l -print0)
          replacement="$RUNNER_TEMP/preview-replacement/Guild Wars Reforged Preview.app"
          mkdir -p "$(dirname "$replacement")"
          ditto "$app" "$replacement"
          printf 'newly signed replacement\n' > \
            "$replacement/Contents/Resources/upgrade-proof"
          echo "app=$app" >> "$GITHUB_OUTPUT"
          echo "replacement=$replacement" >> "$GITHUB_OUTPUT"

      - name: Import protected Preview signing material
        env:
          CERTIFICATE_B64: ${{ secrets.APPLE_DEVELOPER_ID_P12 }}
          CERTIFICATE_PASSWORD: ${{ secrets.APPLE_DEVELOPER_ID_PASSWORD }}
          PROFILE_B64: ${{ secrets.APPLE_PREVIEW_DEVELOPER_ID_PROFILE }}
          NOTARY_KEY_B64: ${{ secrets.APPLE_API_KEY_P8 }}
          API_KEY_ID: ${{ secrets.APPLE_API_KEY_ID }}
          API_ISSUER_ID: ${{ secrets.APPLE_API_ISSUER_ID }}
        run: |
          umask 077
          for value in "$CERTIFICATE_B64" "$CERTIFICATE_PASSWORD" "$PROFILE_B64" \
            "$NOTARY_KEY_B64" "$API_KEY_ID" "$API_ISSUER_ID"; do
            test -n "$value"
          done
          keychain="$RUNNER_TEMP/gwonmac-preview-$(openssl rand -hex 16).keychain-db"
          certificate="$RUNNER_TEMP/preview-developer-id.p12"
          profile="$RUNNER_TEMP/gwonmac-preview.provisionprofile"
          api_key="$RUNNER_TEMP/AuthKey_${API_KEY_ID}.p8"
          keychain_password="$(openssl rand -hex 32)"
          original_keychain="$(security default-keychain -d user | tr -d ' \"')"
          test -n "$original_keychain"
          {
            echo "APPLE_KEYCHAIN=$keychain"
            echo "APPLE_CERTIFICATE_PATH=$certificate"
            echo "APPLE_PROVISIONING_PROFILE=$profile"
            echo "APPLE_SIGNING_IDENTITY=7F9A56793C16683742AA7818FE65221A884FA108"
            echo "APPLE_API_KEY_PATH=$api_key"
            echo "APPLE_API_KEY_ID=$API_KEY_ID"
            echo "APPLE_API_ISSUER_ID=$API_ISSUER_ID"
            echo "APPLE_ORIGINAL_KEYCHAIN=$original_keychain"
          } >> "$GITHUB_ENV"
          printf '%s' "$CERTIFICATE_B64" | base64 --decode > "$certificate"
          printf '%s' "$PROFILE_B64" | base64 --decode > "$profile"
          printf '%s' "$NOTARY_KEY_B64" | base64 --decode > "$api_key"
          security create-keychain -p "$keychain_password" "$keychain"
          security set-keychain-settings -lut 21600 "$keychain"
          security unlock-keychain -p "$keychain_password" "$keychain"
          security import "$certificate" -k "$keychain" \
            -P "$CERTIFICATE_PASSWORD" -T /usr/bin/codesign -T /usr/bin/security
          security set-key-partition-list -S apple-tool:,apple:,codesign: -s \
            -k "$keychain_password" "$keychain"
          security list-keychains -d user -s "$keychain"
          security default-keychain -d user -s "$keychain"
          rm -f "$certificate"

      - name: Sign the Preview and replacement applications
        env:
          GW_SIGN_CHANNEL: preview
        run: |
          GW_SIGN_APP_PATH="${{ steps.handoff.outputs.app }}" \
            node --import ./scripts/ts-hook.mjs --experimental-strip-types \
            scripts/sign-distribution-app.ts
          GW_SIGN_APP_PATH="${{ steps.handoff.outputs.replacement }}" \
            node --import ./scripts/ts-hook.mjs --experimental-strip-types \
            scripts/sign-distribution-app.ts

      - name: Notarize and staple Preview
        run: |
          upload="$RUNNER_TEMP/preview-notarization.zip"
          ditto -c -k --sequesterRsrc --keepParent \
            "${{ steps.handoff.outputs.app }}" "$upload"
          xcrun notarytool submit "$upload" --wait \
            --key "$APPLE_API_KEY_PATH" \
            --key-id "$APPLE_API_KEY_ID" \
            --issuer "$APPLE_API_ISSUER_ID"
          xcrun stapler staple -v "${{ steps.handoff.outputs.app }}"

      - name: Verify Preview identity, entitlements, and ticket
        run: |
          for app in "${{ steps.handoff.outputs.app }}" \
            "${{ steps.handoff.outputs.replacement }}"; do
            codesign --verify --deep --strict --verbose=2 "$app"
            signature="$(codesign -dv --verbose=4 "$app" 2>&1)"
            echo "$signature" | grep "Authority=Developer ID Application"
            echo "$signature" | grep "TeamIdentifier=9NN976MFZ4"
            echo "$signature" | grep "Runtime Version"
            echo "$signature" | grep "Timestamp="
            cmp "$APPLE_PROVISIONING_PROFILE" \
              "$app/Contents/embedded.provisionprofile"
            entitlements="$RUNNER_TEMP/$(basename "$app").entitlements.plist"
            codesign -d --entitlements :- "$app" > "$entitlements"
            plutil -convert json -o "$entitlements.json" "$entitlements"
            node -e '
              const value = require(process.argv[1]);
              require("node:assert/strict").deepEqual(value, {
                "com.apple.application-identifier":
                  "9NN976MFZ4.io.github.mat4m0.gwonmac.preview",
                "com.apple.developer.team-identifier": "9NN976MFZ4",
                "com.apple.security.cs.allow-jit": true,
              });
            ' "$entitlements.json"
          done
          xcrun stapler validate -v "${{ steps.handoff.outputs.app }}"
          spctl --assess --type execute --verbose=4 \
            "${{ steps.handoff.outputs.app }}"

      - name: Remove signing material before runtime tests
        run: |
          security default-keychain -d user -s "$APPLE_ORIGINAL_KEYCHAIN"
          security list-keychains -d user -s "$APPLE_ORIGINAL_KEYCHAIN"
          security delete-keychain "$APPLE_KEYCHAIN"
          rm -f "$APPLE_PROVISIONING_PROFILE" "$APPLE_API_KEY_PATH"
          echo "APPLE_KEYCHAIN=" >> "$GITHUB_ENV"
          echo "APPLE_PROVISIONING_PROFILE=" >> "$GITHUB_ENV"
          echo "APPLE_API_KEY_PATH=" >> "$GITHUB_ENV"

      - name: Prove signed Preview Keychain continuity without signing secrets
        env:
          GW_SIGNED_APP_PATH: ${{ steps.handoff.outputs.app }}
          GW_SIGNED_REPLACEMENT_APP_PATH: ${{ steps.handoff.outputs.replacement }}
          GW_SIGNED_CHANNEL: preview
        run: pnpm test:signed-keychain

      - name: Prepare signed Preview artifact
        id: package
        env:
          COMMIT_SHA: ${{ inputs.commit-sha }}
          SIGNER_SHA: ${{ inputs.signer-sha }}
        run: |
          mkdir distribution
          short="${COMMIT_SHA:0:7}"
          archive="$PWD/distribution/Guild-Wars-Reforged-Preview-$short-macOS-arm64.zip"
          sbom="$PWD/distribution/Guild-Wars-Reforged-Preview-$short-macOS-arm64.spdx.json"
          ditto -c -k --sequesterRsrc --keepParent \
            "${{ steps.handoff.outputs.app }}" "$archive"
          printf '%s\n' "$COMMIT_SHA" > distribution/SOURCE_COMMIT.txt
          printf '%s\n' "$SIGNER_SHA" > distribution/SIGNER_COMMIT.txt
          echo "app=${{ steps.handoff.outputs.app }}" >> "$GITHUB_OUTPUT"
          echo "sbom=$sbom" >> "$GITHUB_OUTPUT"

      - name: Generate signed package SBOM
        uses: anchore/sbom-action@e22c389904149dbc22b58101806040fa8d37a610 # v0
        with:
          path: ${{ steps.package.outputs.app }}
          format: spdx-json
          output-file: ${{ steps.package.outputs.sbom }}
          upload-artifact: false
          upload-release-assets: false

      - name: Finalize signed package checksums
        run: |
          (cd distribution && \
            shasum -a 256 ./*.zip ./*.spdx.json SOURCE_COMMIT.txt \
              SIGNER_COMMIT.txt > SHA256SUMS.txt && \
            shasum -a 256 -c SHA256SUMS.txt)

      - name: Upload signed and tested Preview
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: ${{ inputs.signed-artifact-name }}
          path: distribution/*
          if-no-files-found: error
          retention-days: 1
          compression-level: 0

      - name: Delete any remaining temporary signing material
        if: always()
        run: |
          if [ -n "${APPLE_ORIGINAL_KEYCHAIN:-}" ]; then
            security default-keychain -d user -s "$APPLE_ORIGINAL_KEYCHAIN" || true
            security list-keychains -d user -s "$APPLE_ORIGINAL_KEYCHAIN" || true
          fi
          if [ -n "${APPLE_KEYCHAIN:-}" ]; then
            security delete-keychain "$APPLE_KEYCHAIN" || true
          fi
          rm -f "${APPLE_CERTIFICATE_PATH:-}" \
            "${APPLE_PROVISIONING_PROFILE:-}" "${APPLE_API_KEY_PATH:-}"
