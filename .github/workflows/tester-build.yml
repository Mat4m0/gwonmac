name: Tester build

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: tester-build-${{ github.ref }}
  cancel-in-progress: false

jobs:
  verify:
    uses: ./.github/workflows/native-verify.yml
    with:
      artifact-name: snapshot-assets-${{ github.run_id }}
      artifact-retention-days: 1

  publish:
    needs: verify
    permissions:
      actions: read
      artifact-metadata: write
      attestations: write
      contents: write
      id-token: write
    uses: ./.github/workflows/publish-snapshot.yml
    with:
      artifact-name: snapshot-assets-${{ github.run_id }}-macos-arm64-${{ github.run_attempt }}
      commit-sha: ${{ github.sha }}
      run-number: ${{ github.run_number }}
