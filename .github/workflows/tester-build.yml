# A developer build names its exact commit and stops after the same ad-hoc
# packaged smoke used by CI. It never enters an Apple signing environment.
name: Developer build

on:
  workflow_dispatch:
    inputs:
      commit-sha:
        description: Exact 40-character commit to build for development testing.
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: tester-build-${{ github.ref }}
  cancel-in-progress: false

jobs:
  validate:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - name: Require an exact commit
        env:
          COMMIT_SHA: ${{ inputs.commit-sha }}
        run: |
          if ! [[ "$COMMIT_SHA" =~ ^[0-9a-f]{40}$ ]]; then
            echo "Invalid developer-build commit: $COMMIT_SHA" >&2
            exit 1
          fi

  verify:
    needs: validate
    uses: ./.github/workflows/macos-verify.yml
    with:
      artifact-name: developer-build-${{ inputs.commit-sha }}-${{ github.run_id }}-${{ github.run_attempt }}
      artifact-retention-days: 7
      checkout-ref: ${{ inputs.commit-sha }}
      package-intent: developer-build
