name: ArenaNet client canary

on:
  schedule:
    - cron: "17 6 * * 1"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: arenanet-client-canary
  cancel-in-progress: false

jobs:
  live-client:
    runs-on: macos-15
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@008330803749db0355799c700092d9a85fd074e9 # v6.0.9
        with:
          version: 11.13.1
      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: "24"
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Exercise the current production client
        env:
          GW_LIVE_SMOKE: "1"
        run: |
          pnpm build
          pnpm exec playwright test \
            --config=tests/electron/playwright.config.ts \
            tests/electron/live.spec.ts
