# ArenaNet ships client builds on no schedule this project can see, and every
# certified index belongs to one exact build: this is what notices the change.
name: ArenaNet client canary

on:
  schedule:
    - cron: "17 6 * * 1"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: arenanet-client-canary
  cancel-in-progress: false

jobs:
  live-client:
    runs-on: macos-15
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@d15e628ca66d93ee5f352c71671a7bc6a97af5c9 # v6.0.8
      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: "24"
          cache: pnpm
      # The runner image's default toolchain is not this repository's. Installs
      # the one rust-toolchain.toml names, with no version repeated here.
      - name: Install the pinned Rust toolchain
        run: rustup toolchain install
      - run: pnpm install --frozen-lockfile
      - name: Exercise the current production client
        env:
          GW_LIVE_SMOKE: "1"
        run: |
          pnpm build
          pnpm exec playwright test \
            --config=tests/electron/playwright.config.ts \
            tests/electron/live.spec.ts
