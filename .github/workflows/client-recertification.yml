# ArenaNet ships client builds on no schedule this project can see. This
# workflow records verifier evidence for a new generation. It cannot grant a
# capability, edit a certificate, push a branch, or open a pull request: the
# isolated runtime verifier is the sole launch authority.
name: ArenaNet client recertification

on:
  schedule:
    - cron: "17 * * * *"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: arenanet-client-recertification
  cancel-in-progress: false

jobs:
  # The frequent unchanged path reads one manifest and installs nothing.
  detect:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      issues: write
    outputs:
      changed: ${{ steps.unreported.outputs.changed }}
      fingerprint: ${{ steps.published.outputs.fingerprint }}
      recorded: ${{ steps.published.outputs.recorded }}
      verifier_abi: ${{ steps.published.outputs.verifier_abi }}
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false
      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: "24"
      - name: Read the published client generation
        id: published
        run: node --import ./scripts/ts-hook.mjs scripts/official-client.ts
      - name: Skip a generation that already has durable evidence
        id: unreported
        env:
          CHANGED: ${{ steps.published.outputs.changed }}
          FINGERPRINT: ${{ steps.published.outputs.fingerprint }}
          GH_TOKEN: ${{ github.token }}
          VERIFIER_ABI: ${{ steps.published.outputs.verifier_abi }}
        run: |
          if [ "$CHANGED" != "true" ]; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          short="${FINGERPRINT:0:12}"
          if [ -n "$(gh issue list --state open --label client-recertification \
            --search "$short v$VERIFIER_ABI in:title" --json number --jq '.[].number')" ]; then
            echo "Generation $short already has an open tracking issue."
            echo "changed=false" >> "$GITHUB_OUTPUT"
          elif [ -n "$(gh issue list --state all --label client-recertification-proved \
            --search "$short v$VERIFIER_ABI in:title" --json number --jq '.[].number')" ]; then
            echo "Generation $short already has a signed successful report."
            echo "changed=false" >> "$GITHUB_OUTPUT"
          else
            echo "changed=true" >> "$GITHUB_OUTPUT"
          fi

  derive:
    needs: detect
    if: needs.detect.outputs.changed == 'true'
    runs-on: macos-15
    timeout-minutes: 45
    permissions:
      attestations: write
      contents: read
      id-token: write
    outputs:
      outcome: ${{ steps.derive.outputs.outcome }}
      summary: ${{ steps.derive.outputs.summary }}
      build: ${{ steps.derive.outputs.build }}
      fingerprint: ${{ steps.official.outputs.fingerprint }}
    steps:
      - name: Name the evidence directory
        run: echo "EVIDENCE=$RUNNER_TEMP/evidence" >> "$GITHUB_ENV"
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@d15e628ca66d93ee5f352c71671a7bc6a97af5c9 # v6.0.8
      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: "24"
          cache: pnpm
      - name: Install the pinned Rust toolchain
        run: rustup toolchain install
      - run: pnpm install --frozen-lockfile
      - run: pnpm build
      - name: Download the published client code artifacts
        id: official
        run: pnpm client:official --download "$RUNNER_TEMP/official"

      # This adversarial suite mutates the exact downloaded WASM to prove the
      # structural checks still reject plausible near-misses. It is an
      # additional fail-closed qualification gate, not launch authority: only
      # the production runtime verifier below can prove a protected feature.
      - name: Qualify the exact published client artifact
        id: qualification
        continue-on-error: true
        env:
          GW_CLIENT_WASM: ${{ steps.official.outputs.wasm }}
        run: |
          mkdir -p "$EVIDENCE"
          set +e
          pnpm test:client-artifact > "$EVIDENCE/client-artifact.txt" 2>&1
          qualification_exit=$?
          set -e
          if [ "$qualification_exit" -eq 0 ]; then
            qualification_status=proved
          else
            qualification_status=refused
          fi
          jq -n --arg status "$qualification_status" \
            --argjson exitCode "$qualification_exit" \
            '{status: $status, exitCode: $exitCode}' \
            > "$EVIDENCE/client-artifact.json"
          exit "$qualification_exit"

      # Both commands inspect the same original bytes. Neither writes source.
      # `recertify` composes template preparation and Enhancement analysis in
      # one process, so an Enhancement verdict cannot outlive a refused
      # template predicate or a newly generated exact table row.
      - name: Verify what the published build proves
        id: derive
        env:
          QUALIFICATION_OUTCOME: ${{ steps.qualification.outcome }}
          WASM: ${{ steps.official.outputs.wasm }}
        run: |
          mkdir -p "$EVIDENCE"
          set +e
          node build/tools/certification.js template "$WASM" --emit-ts \
            > "$EVIDENCE/template-save.json" 2> "$EVIDENCE/template-save.txt"
          node build/tools/certification.js recertify "$WASM" \
            > "$EVIDENCE/enhancement.json" 2> "$EVIDENCE/enhancement.txt"
          node build/tools/certification.js verify "$WASM" \
            > "$EVIDENCE/runtime-verdicts.json" 2> "$EVIDENCE/runtime-verdicts.txt"
          set -e
          build="$(jq -er '.sha256' "$EVIDENCE/template-save.json")"
          if [ "$QUALIFICATION_OUTCOME" != "success" ]; then
            outcome=investigation
            summary="the real-client qualification suite refused the exact downloaded artifact"
          elif jq -e '.templateSaving and (.features != null) and (.features | to_entries | all(.value.status == "proved"))' \
            "$EVIDENCE/runtime-verdicts.json" >/dev/null; then
            outcome=ready
            summary="the runtime semantic verifier proved every protected feature and exact-artifact qualification passed"
          else
            outcome=investigation
            summary="$(jq -cr '{templateSaving, verifierAbi, features, reasons}' \
              "$EVIDENCE/runtime-verdicts.json" 2>/dev/null \
              || printf '%s' 'the runtime semantic verifier refused the client')"
          fi
          {
            echo "outcome=$outcome"
            echo "summary=$summary"
            echo "build=$build"
          } >> "$GITHUB_OUTPUT"

      - name: Collect semantic comparison evidence
        if: always()
        env:
          WASM: ${{ steps.official.outputs.wasm }}
        run: |
          mkdir -p "$EVIDENCE"
          if [ -n "$WASM" ] && [ -f "$WASM" ] \
            && [ -f build/tools/certification.js ]; then
            node build/tools/certification.js compare "$WASM" "$EVIDENCE" || true
          fi
          if [ ! -s "$EVIDENCE/carry-forward.md" ]; then
            printf '%s\n' '## Guild Wars patch comparison' '' \
              'Evidence collection did not complete. Review the failed workflow steps.' \
              > "$EVIDENCE/carry-forward.md"
          fi
          if [ ! -s "$EVIDENCE/carry-forward.json" ]; then
            printf '%s\n' '{"status":"collection-failed"}' \
              > "$EVIDENCE/carry-forward.json"
          fi

      # Official client artifacts remain in the runner temporary directory and
      # are never uploaded. Only machine-readable and human-readable evidence
      # is retained.
      - name: Publish the verification evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: client-recertification-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/evidence
          retention-days: 30
          if-no-files-found: error

      # The artifact is convenient for review but expires. This custom
      # attestation binds the machine-readable verdicts to the exact official
      # WASM digest and remains queryable through GitHub's attestations API.
      - name: Sign the runtime semantic report
        if: always() && steps.derive.outputs.build != ''
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        with:
          subject-name: Gw.jspi.wasm
          subject-digest: sha256:${{ steps.derive.outputs.build }}
          predicate-type: https://gwonmac.com/attestations/client-verification/v1
          predicate-path: ${{ runner.temp }}/evidence/runtime-verdicts.json

  # Reporting has no source-writing permission. A tracking issue records a
  # refused invariant for investigation; it is never launch authority.
  publish:
    needs: [detect, derive]
    if: always() && needs.derive.result != 'skipped'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      issues: write
    env:
      GH_REPO: ${{ github.repository }}
      RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
    steps:
      - name: Receive the verification evidence
        continue-on-error: true
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: client-recertification-${{ github.run_id }}-${{ github.run_attempt }}
          path: evidence
      - name: Ensure failure evidence is reportable
        if: always()
        run: |
          mkdir -p evidence
          if [ ! -s evidence/carry-forward.md ]; then
            printf '%s\n' '## Guild Wars patch comparison' '' \
              'Evidence collection did not complete. Review the failed workflow steps.' \
              > evidence/carry-forward.md
          fi
      - name: Record a proved generation
        if: needs.derive.result == 'success' && needs.derive.outputs.outcome == 'ready'
        env:
          BUILD: ${{ needs.derive.outputs.build }}
          FINGERPRINT: ${{ needs.derive.outputs.fingerprint }}
          GH_TOKEN: ${{ github.token }}
          VERIFIER_ABI: ${{ needs.detect.outputs.verifier_abi }}
        run: |
          short="${FINGERPRINT:0:12}"
          gh label create client-recertification-proved --force --color 0e8a16 \
            --description "An ArenaNet client generation proved by the runtime verifier"
          {
            printf 'Published client generation `%s`, WASM `%s`.\n\n' "$short" "$BUILD"
            printf '%s\n' '- outcome: every protected feature proved independently and exact-artifact qualification passed'
            printf '%s\n' '- authority: evidence only; the shipped runtime verifier remains sole launch authority'
            printf '%s\n' '- qualification evidence: `client-artifact.json` and `client-artifact.txt` in that run artifact'
            printf '%s\n' "- signed report: $RUN_URL"
            echo
            printf '%s\n' '```json'
            jq -c . evidence/runtime-verdicts.json
            printf '%s\n' '```'
          } > proved.md
          issue="$(gh issue create --label client-recertification-proved \
            --title "ArenaNet client $short v$VERIFIER_ABI: semantic proof passed" \
            --body-file proved.md)"
          gh issue close "$issue" --reason completed
      - name: Open the tracking issue
        if: always() && needs.derive.outputs.outcome != 'ready'
        env:
          BUILD: ${{ needs.derive.outputs.build }}
          DERIVE_RESULT: ${{ needs.derive.result }}
          FINGERPRINT: ${{ needs.derive.outputs.fingerprint || needs.detect.outputs.fingerprint }}
          GH_TOKEN: ${{ github.token }}
          SUMMARY: ${{ needs.derive.outputs.summary }}
          VERIFIER_ABI: ${{ needs.detect.outputs.verifier_abi }}
        run: |
          if [[ "$FINGERPRINT" =~ ^[0-9a-f]{64}$ ]]; then
            short="${FINGERPRINT:0:12}"
          else
            short=unknown
          fi
          if [ -z "$SUMMARY" ]; then
            SUMMARY="evidence collection ended with status $DERIVE_RESULT"
          fi
          gh label create client-recertification --force --color 1d76db \
            --description "An ArenaNet client build requiring semantic verification"
          title="ArenaNet client $short v$VERIFIER_ABI: invariant refused, investigation needed"
          {
            printf 'Published client generation `%s`, WASM `%s`.\n\n' "$short" "$BUILD"
            printf '%s\n' "- outcome: $SUMMARY"
            printf '%s\n' '- source branch: none; this workflow cannot grant capabilities'
            printf '%s\n' "- evidence: $RUN_URL"
            printf '%s\n' '- exact-artifact qualification: `client-artifact.json` and `client-artifact.txt` in that run artifact'
            printf '%s\n' '- semantic verdicts: `runtime-verdicts.json` in that run artifact'
            echo
            cat evidence/carry-forward.md
            echo
            printf '%s\n' '`internal/upstream/recertify.md` owns any investigation.'
            printf '%s\n' 'Keep the official client playable and restore only the feature whose invariant failed.'
          } > tracking.md
          gh issue create --label client-recertification \
            --assignee mat4m0 --title "$title" --body-file tracking.md
