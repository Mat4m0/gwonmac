name: Bug report
description: Report a crash, startup, download, gameplay, or performance problem.
title: "[Bug]: "
labels:
  - bug
body:
  - type: markdown
    attributes:
      value: |
        Thanks for reporting a problem. A short description is enough; diagnostics and technical details are optional.

        GitHub issues are public. If you attach diagnostics, the app excludes credentials, account identifiers, packet contents, HTTP bodies, headers, cookies, filesystem paths, and crash dumps.
  - type: dropdown
    id: area
    attributes:
      label: Problem area
      options:
        - Crash or unexpected quit
        - Startup or update
        - Download or loading
        - Performance or stutter
        - Graphics
        - Input or audio
        - Login
        - Other
    validations:
      required: true
  - type: textarea
    id: behavior
    attributes:
      label: What happened?
      description: Describe the problem in your own words. One or two sentences is fine.
      placeholder: The screen froze after I used a Wintersday alcohol item, then recovered a few minutes later.
    validations:
      required: true
  - type: textarea
    id: reproduction
    attributes:
      label: Steps to reproduce (optional)
      description: Leave this blank if you do not know how to reproduce it.
      placeholder: |
        1. …
        2. …
  - type: textarea
    id: diagnostics
    attributes:
      label: Diagnostics (optional)
      description: If you have a `.gwdiag`, make a copy, rename that copy to end in `.zip`, then drag it here. GitHub does not accept the `.gwdiag` extension.
      placeholder: Drag the renamed .zip copy here, or leave this blank.
  - type: input
    id: mac
    attributes:
      label: Mac and macOS version (optional)
      description: Helpful if you are not attaching diagnostics.
      placeholder: M1 Pro MacBook Pro, macOS 15.5
