name: Feature request
description: Suggest an improvement or a new capability.
title: "[Feature]: "
labels:
  - enhancement
body:
  - type: markdown
    attributes:
      value: |
        Thanks for sharing an idea. A short description is enough.

        GitHub issues are public. Do not include account information or other private data.
  - type: textarea
    id: request
    attributes:
      label: What would you like?
      description: Describe the feature or improvement in your own words.
      placeholder: I would like GWonMac to…
    validations:
      required: true
  - type: textarea
    id: motivation
    attributes:
      label: Why would this help? (optional)
      description: Tell us what this would make easier or possible for you.
